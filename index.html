<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Гэрэл — Сонсох номын сан</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* Хөх тэнгэр — the night sky, and gerel, the lamp light within it */
    --night:#0A1730;
    --night-2:#122444;
    --lamp:#FFC24B;
    --lamp-dim:#B8862B;
    --dawn:#7FA3CC;
    --paper:#F4F1E8;
    --display:'Unbounded', system-ui, sans-serif;
    --body:'Inter', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0;
    background:var(--night);
    color:var(--paper);
    font-family:var(--body);
    min-height:100%;
    -webkit-text-size-adjust:100%;
  }
  body{ display:flex; flex-direction:column; min-height:100vh; min-height:100dvh; }

  header{
    padding:18px 20px 14px;
    border-bottom:1px solid rgba(127,163,204,0.22);
    display:flex; align-items:baseline; justify-content:space-between;
    gap:12px; flex-wrap:wrap;
  }
  .wordmark{
    font-family:var(--display); font-weight:800; font-size:20px;
    letter-spacing:0.02em; color:var(--lamp);
  }
  .wordmark span{ color:var(--paper); font-weight:600; }
  .bookmeta{ font-size:14px; color:var(--dawn); text-align:right; flex:1; min-width:140px; }
  .bookmeta strong{ color:var(--paper); font-weight:600; display:block; }

  main{
    flex:1; padding:24px 20px 12px;
    display:flex; flex-direction:column; justify-content:center; gap:20px;
  }
  #chapterLabel{
    font-size:15px; font-weight:600; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--lamp-dim);
  }
  #reading{
    font-size:clamp(24px, 5.2vw, 40px); line-height:1.45;
    font-weight:600; letter-spacing:-0.01em; max-width:22ch;
  }
  #reading .spoken{ color:var(--lamp); }
  #reading .pending{ color:rgba(244,241,232,0.55); }
  #upNext{
    font-size:clamp(15px, 2.6vw, 19px); line-height:1.6;
    color:rgba(127,163,204,0.75); max-width:40ch;
  }

  footer{
    padding:12px 16px calc(20px + env(safe-area-inset-bottom));
    border-top:1px solid rgba(127,163,204,0.22);
    display:flex; flex-direction:column; gap:12px;
  }
  .transport{ display:grid; grid-template-columns:1fr 1.4fr 1fr; gap:12px; }
  button{
    font-family:var(--body); font-size:17px; font-weight:600;
    color:var(--night); background:var(--paper);
    border:none; border-radius:18px; padding:22px 12px;
    min-height:76px; cursor:pointer; line-height:1.2;
  }
  button.play{ background:var(--lamp); font-size:19px; font-weight:800; }
  button.quiet{
    background:transparent; color:var(--dawn);
    border:2px solid rgba(127,163,204,0.4);
    min-height:56px; padding:14px 12px; font-size:15px; border-radius:14px;
  }
  button:disabled{ opacity:0.35; cursor:default; }
  button:focus-visible{ outline:4px solid var(--lamp); outline-offset:3px; }
  .secondary{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  #status{ font-size:14px; color:var(--dawn); min-height:20px; text-align:center; }

  /* ---- Shelf: the catalogue ---- */
  #shelf{
    position:fixed; inset:0; z-index:45; background:var(--night);
    display:flex; flex-direction:column; gap:12px; overflow-y:auto;
    padding:22px 18px calc(20px + env(safe-area-inset-bottom));
  }
  #shelf h1{
    font-family:var(--display); font-weight:800;
    font-size:clamp(30px,8vw,44px); margin:0; color:var(--lamp);
  }
  #shelf .sub{ margin:0 0 6px; color:var(--dawn); font-size:16px; }
  .quickRow{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .shelfGroup h2{
    font-family:var(--display); font-size:15px; color:var(--lamp-dim);
    margin:20px 0 8px; letter-spacing:0.05em;
  }
  .bookRow{
    display:block; width:100%; text-align:left;
    background:transparent; color:var(--paper);
    border:2px solid rgba(127,163,204,0.3);
    border-radius:16px; padding:20px 16px; margin-bottom:10px;
    font-size:19px; font-weight:600; min-height:0; line-height:1.35;
  }
  .bookRow .who{
    display:block; font-size:14px; font-weight:400;
    color:var(--dawn); margin-top:4px;
  }
  .bookRow.on{ border-color:var(--lamp); color:var(--lamp); border-width:3px; }
  .bookRow.on .who{ color:var(--lamp-dim); }
  #shelfNote{
    border:2px dashed rgba(127,163,204,0.35); border-radius:16px;
    padding:18px; color:var(--dawn); font-size:15px; line-height:1.6;
  }
  #openFileLabel{
    display:block; text-align:center; cursor:pointer;
    border:2px solid rgba(127,163,204,0.4); border-radius:14px;
    padding:18px; color:var(--dawn); font-size:15px; margin-top:10px;
  }
  #openFileLabel:focus-within{ outline:4px solid var(--lamp); outline-offset:3px; }
  #fileInput{ position:absolute; opacity:0; width:1px; height:1px; }
  .credit{ font-size:13px; color:rgba(127,163,204,0.6); margin-top:14px; line-height:1.6; }

  #tocPanel{
    position:fixed; inset:0; z-index:40; background:var(--night-2);
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    overflow-y:auto; display:flex; flex-direction:column; gap:10px;
  }
  #tocPanel h2{ font-family:var(--display); font-size:19px; margin:0 0 6px; color:var(--lamp); }
  .tocItem{
    text-align:left; background:transparent; color:var(--paper);
    border:2px solid rgba(127,163,204,0.3); border-radius:14px;
    padding:18px 16px; font-size:17px; min-height:0;
  }
  .tocItem.current{ border-color:var(--lamp); color:var(--lamp); }
  .hidden{ display:none !important; }
</style>
</head>
<body>

<header>
  <div class="wordmark">Гэрэл <span>· сонсох номын сан</span></div>
  <div class="bookmeta"><strong id="bookTitle">—</strong><span id="bookAuthor"></span></div>
</header>

<main>
  <div id="chapterLabel">Ном сонгоно уу</div>
  <div id="reading"></div>
  <div id="upNext"></div>
</main>

<footer>
  <div id="status" role="status" aria-live="polite"></div>
  <div class="transport">
    <button id="prevBtn" disabled>◀ Өмнөх<br>өгүүлбэр</button>
    <button id="playBtn" class="play" disabled>▶ Унших</button>
    <button id="nextBtn" disabled>Дараах<br>өгүүлбэр ▶</button>
  </div>
  <div class="secondary">
    <button id="speedBtn" class="quiet">Хурд 1×</button>
    <button id="readerBtn" class="quiet">Хоолой: Есүй</button>
    <button id="tocBtn" class="quiet" disabled>Бүлгүүд</button>
    <button id="shelfBtn" class="quiet">Номын сан</button>
  </div>
  <div class="secondary">
    <button id="voiceBtn" class="quiet" disabled>Дуут удирдлага</button>
  </div>
</footer>

<div id="tocPanel" class="hidden" aria-label="Бүлгүүд">
  <h2>Бүлгүүд</h2>
  <div id="tocList"></div>
  <button id="tocCloseBtn" class="quiet">Хаах</button>
</div>

<div id="shelf">
  <h1>Гэрэл</h1>
  <p class="sub">Ном сонгоод сонсоорой.</p>

  <div class="quickRow">
    <button id="resumeBtn" class="play hidden">Үргэлжлүүлэх</button>
    <button id="surpriseBtn" class="quiet">Ямар нэг үлгэр</button>
  </div>

  <div id="shelfList"></div>
  <div id="shelfNote" class="hidden"></div>

  <label id="openFileLabel" tabindex="0">
    Өөрийн ном нээх
    <input type="file" id="fileInput" accept=".epub,application/epub+zip">
  </label>

  <p class="credit" id="shelfCredit"></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@1.40.0/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js"></script>
<script>
// ============================================================
// Azure voice
// ============================================================
const AZURE_SPEECH_KEY = "2YOi3mQGa30skQ1ukJe2GAurLeXkqwGRnFJIo0i8ZssXijdQS243JQQJ99CGAC3pKaRXJ3w3AAAYACOGw5bp";
const AZURE_SPEECH_REGION = "eastasia";

// Mongolian has exactly two Azure voices, so this is the whole choice.
const READERS = [
  { id: 'mn-MN-YesuiNeural', label: 'Есүй' },
  { id: 'mn-MN-BataaNeural', label: 'Батаа' }
];
let readerIndex = 0;
try{
  const saved = parseInt(localStorage.getItem('gerel:reader'), 10);
  if(!isNaN(saved) && READERS[saved]) readerIndex = saved;
}catch(e){}
function currentVoice(){ return READERS[readerIndex].id; }

// One audio element for the whole session. Mobile browsers only allow audio a
// person started, so this element is unlocked by the first tap and reused for
// everything after. A fresh player per clip gets silently blocked.
const audioEl = new Audio();
audioEl.preload = 'auto';

let audioUnlocked = false;
function unlockAudio(){
  if(audioUnlocked) return;
  audioUnlocked = true;
  audioEl.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=';
  audioEl.play().catch(()=>{});
}

const SPEEDS = [0.6, 0.7, 0.85, 1.0, 1.15, 1.3];
let speedIndex = 2;
try{
  const saved = parseInt(localStorage.getItem('gerel:speed'), 10);
  if(!isNaN(saved) && SPEEDS[saved]) speedIndex = saved;
}catch(e){}

function currentRatePercent(){
  const pct = Math.round((SPEEDS[speedIndex] - 1) * 100);
  return (pct >= 0 ? '+' : '') + pct + '%';
}

function escapeXml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
}

function ssmlFor(inner){
  return '<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="mn-MN">'
    + '<voice name="' + currentVoice() + '"><prosody rate="' + currentRatePercent() + '">'
    + inner + '</prosody></voice></speak>';
}

function newSynth(){
  const cfg = SpeechSDK.SpeechConfig.fromSubscription(AZURE_SPEECH_KEY, AZURE_SPEECH_REGION);
  cfg.speechSynthesisVoiceName = currentVoice();
  cfg.speechSynthesisOutputFormat = SpeechSDK.SpeechSynthesisOutputFormat.Audio24Khz48KBitRateMonoMp3;
  return new SpeechSDK.SpeechSynthesizer(cfg, null);   // null = give us the audio, don't play it
}

// Narrate a whole paragraph in one pass. Sentence-by-sentence synthesis
// flattens the delivery, because the voice restarts cold each time. Given the
// full paragraph it rises and falls naturally, and the word timings tell us
// which sentence to show on screen.
function synthParagraph(sentences){
  return new Promise((resolve, reject) => {
    const synth = newSynth();
    const head = '<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="mn-MN">'
      + '<voice name="' + currentVoice() + '"><prosody rate="' + currentRatePercent() + '">';
    let ssml = head;
    const spans = [];
    sentences.forEach((text, i) => {
      if(i > 0) ssml += '<break time="260ms"/>';   // a narrator's beat
      const safe = escapeXml(text);
      spans.push({ start: ssml.length, len: safe.length, exact: safe.length === text.length });
      ssml += safe;
    });
    ssml += '</prosody></voice></speak>';

    const boundaries = [];
    synth.wordBoundary = (sender, e) => {
      const at = e.textOffset;
      for(let i = 0; i < spans.length; i++){
        const sp = spans[i];
        if(at >= sp.start && at < sp.start + sp.len){
          boundaries.push({
            sentence: i,
            char: sp.exact ? at - sp.start : 0,
            len: sp.exact ? e.wordLength : 0,
            time: e.audioOffset / 10000000
          });
          return;
        }
      }
    };

    synth.speakSsmlAsync(ssml,
      result => {
        if(result.reason === SpeechSDK.ResultReason.SynthesizingAudioCompleted && result.audioData){
          const url = URL.createObjectURL(new Blob([result.audioData], {type:'audio/mpeg'}));
          try{ synth.close(); }catch(e){}
          resolve({ url, boundaries });
        } else {
          try{ synth.close(); }catch(e){}
          reject(new Error(result.errorDetails || 'synthesis failed'));
        }
      },
      err => { try{ synth.close(); }catch(e){} reject(new Error(err)); });
  });
}

// Short spoken phrase — used to read book titles aloud on the shelf.
let speakingNow = null;
function say(text){
  const synth = newSynth();
  const token = {};
  speakingNow = token;
  synth.speakSsmlAsync(ssmlFor(escapeXml(text)),
    result => {
      try{ synth.close(); }catch(e){}
      if(speakingNow !== token) return;
      if(result.audioData){
        audioEl.src = URL.createObjectURL(new Blob([result.audioData], {type:'audio/mpeg'}));
        audioEl.play().catch(()=>{});
      }
    },
    () => { try{ synth.close(); }catch(e){} });
}

const clipCache = new Map();
function clipKey(c, b){ return c + ':' + b; }
function getClip(c, b){
  const key = clipKey(c, b);
  if(!clipCache.has(key)) clipCache.set(key, synthParagraph(book.chapters[c].blocks[b].sentences));
  return clipCache.get(key);
}
function clearClips(keep = []){
  const keepSet = new Set(keep);
  clipCache.forEach((val, key) => {
    if(keepSet.has(key)) return;
    Promise.resolve(val).then(clip => { if(clip && clip.url) URL.revokeObjectURL(clip.url); }).catch(()=>{});
    clipCache.delete(key);
  });
}

function playClip(clip, startTime){
  return new Promise((resolve, reject) => {
    let frame = null;
    function cleanup(){
      audioEl.removeEventListener('ended', onEnd);
      audioEl.removeEventListener('error', onErr);
      if(frame) cancelAnimationFrame(frame);
    }
    function onEnd(){ cleanup(); resolve(); }
    function onErr(){ cleanup(); reject(new Error('audio playback error')); }
    function tick(){
      if(!playing){ cleanup(); return; }
      const t = audioEl.currentTime;
      let cur = null;
      for(const b of clip.boundaries){
        if(b.time <= t) cur = b; else break;
      }
      if(cur){ sentenceIndex = cur.sentence; render(cur.char + cur.len); }
      frame = requestAnimationFrame(tick);
    }
    audioEl.addEventListener('ended', onEnd);
    audioEl.addEventListener('error', onErr);
    audioEl.src = clip.url;
    if(startTime > 0){
      audioEl.addEventListener('loadedmetadata', () => {
        try{ audioEl.currentTime = startTime; }catch(e){}
      }, { once: true });
    }
    audioEl.play().then(() => { frame = requestAnimationFrame(tick); })
                  .catch(err => { cleanup(); reject(err); });
  });
}

// ============================================================
// EPUB reading
// ============================================================
function splitSentences(text){
  const raw = text.match(/[^.!?…]+[.!?…]+[»”"']?|[^.!?…]+$/g) || [text];
  const out = [];
  let carry = '';
  raw.forEach(part => {
    const s = (carry + part).trim();
    if(!s) return;
    if(s.length < 16){ carry = s + ' '; return; }
    out.push(s);
    carry = '';
  });
  if(carry.trim()) out.push(carry.trim());
  return out.length ? out : [text];
}

const book = { title:'', author:'', chapters:[] };

function stripTags(html){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('script, style').forEach(n => n.remove());
  return doc;
}

function paragraphsFrom(doc){
  const els = [...doc.querySelectorAll('p, h1, h2, h3, h4, li, blockquote')];
  const source = els.length ? els : [doc.body];
  const out = [];
  source.forEach(el => {
    const t = (el.textContent || '').replace(/\s+/g, ' ').trim();
    if(t.length > 1) out.push(t);
  });
  return out;
}

async function loadEpub(data, fallbackName){
  const zip = await JSZip.loadAsync(data);

  const container = await zip.file('META-INF/container.xml').async('string');
  const opfPath = new DOMParser()
    .parseFromString(container, 'application/xml')
    .querySelector('rootfile').getAttribute('full-path');
  const opfDir = opfPath.includes('/') ? opfPath.replace(/\/[^/]*$/, '/') : '';

  const opfXml = new DOMParser()
    .parseFromString(await zip.file(opfPath).async('string'), 'application/xml');

  book.title = (opfXml.querySelector('metadata > *|title') || opfXml.querySelector('title'))
    ?.textContent?.trim() || fallbackName || 'Ном';
  book.author = (opfXml.querySelector('metadata > *|creator') || opfXml.querySelector('creator'))
    ?.textContent?.trim() || '';

  const hrefById = {};
  opfXml.querySelectorAll('manifest > item').forEach(item => {
    hrefById[item.getAttribute('id')] = item.getAttribute('href');
  });
  const spine = [...opfXml.querySelectorAll('spine > itemref')]
    .map(ref => hrefById[ref.getAttribute('idref')]).filter(Boolean);

  const titleByFile = {};
  const ncxName = Object.values(hrefById).find(h => h && h.endsWith('.ncx'));
  if(ncxName){
    const ncxFile = zip.file(opfDir + ncxName);
    if(ncxFile){
      const ncx = new DOMParser().parseFromString(await ncxFile.async('string'), 'application/xml');
      ncx.querySelectorAll('navPoint').forEach(np => {
        const src = np.querySelector('content')?.getAttribute('src') || '';
        const label = np.querySelector('navLabel text')?.textContent?.trim();
        const key = src.split('#')[0].split('/').pop();
        if(key && label && !titleByFile[key]) titleByFile[key] = label;
      });
    }
  }

  book.chapters = [];
  for(const href of spine){
    const entry = zip.file(opfDir + href) || zip.file(href);
    if(!entry) continue;
    const doc = stripTags(await entry.async('string'));
    const paragraphs = paragraphsFrom(doc);
    if(!paragraphs.length) continue;
    const blocks = paragraphs.map(par => ({ sentences: splitSentences(par) }))
                             .filter(b => b.sentences.length);
    if(!blocks.length) continue;
    const fileKey = href.split('/').pop();
    const heading = doc.querySelector('h1, h2, h3')?.textContent?.trim();
    book.chapters.push({
      title: titleByFile[fileKey] || heading || paragraphs[0].slice(0, 60),
      blocks
    });
  }
  if(!book.chapters.length) throw new Error('Энэ номноос текст олдсонгүй.');
}

// ============================================================
// Player
// ============================================================
const els = {
  fileInput: document.getElementById('fileInput'),
  bookTitle: document.getElementById('bookTitle'),
  bookAuthor: document.getElementById('bookAuthor'),
  chapterLabel: document.getElementById('chapterLabel'),
  reading: document.getElementById('reading'),
  upNext: document.getElementById('upNext'),
  status: document.getElementById('status'),
  playBtn: document.getElementById('playBtn'),
  prevBtn: document.getElementById('prevBtn'),
  nextBtn: document.getElementById('nextBtn'),
  tocBtn: document.getElementById('tocBtn'),
  voiceBtn: document.getElementById('voiceBtn'),
  speedBtn: document.getElementById('speedBtn'),
  readerBtn: document.getElementById('readerBtn'),
  shelfBtn: document.getElementById('shelfBtn'),
  tocPanel: document.getElementById('tocPanel'),
  tocList: document.getElementById('tocList'),
  tocCloseBtn: document.getElementById('tocCloseBtn'),
  shelf: document.getElementById('shelf'),
  shelfList: document.getElementById('shelfList'),
  shelfNote: document.getElementById('shelfNote'),
  shelfCredit: document.getElementById('shelfCredit'),
  resumeBtn: document.getElementById('resumeBtn'),
  surpriseBtn: document.getElementById('surpriseBtn')
};

let chapterIndex = 0, blockIndex = 0, sentenceIndex = 0, playing = false;

function positionKey(){ return 'gerel:pos:' + book.title; }
function savePosition(){
  try{ localStorage.setItem(positionKey(), JSON.stringify({ chapterIndex, blockIndex, sentenceIndex })); }catch(e){}
}
function restorePosition(){
  try{
    const saved = JSON.parse(localStorage.getItem(positionKey()) || 'null');
    const ch = saved && book.chapters[saved.chapterIndex];
    if(ch){
      chapterIndex = saved.chapterIndex;
      blockIndex = Math.min(saved.blockIndex || 0, ch.blocks.length - 1);
      sentenceIndex = Math.min(saved.sentenceIndex || 0, ch.blocks[blockIndex].sentences.length - 1);
      return true;
    }
  }catch(e){}
  return false;
}

function currentChapter(){ return book.chapters[chapterIndex]; }
function currentBlock(){ return currentChapter().blocks[blockIndex]; }
function currentSentence(){ return currentBlock().sentences[sentenceIndex] || ''; }

function sentenceCounter(){
  const ch = currentChapter();
  let before = 0;
  for(let i = 0; i < blockIndex; i++) before += ch.blocks[i].sentences.length;
  const total = ch.blocks.reduce((n, b) => n + b.sentences.length, 0);
  return { at: before + sentenceIndex + 1, total };
}

function escapeHtml(s){
  return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

function render(highlightChars){
  if(!book.chapters.length) return;
  const chapter = currentChapter();
  const count = sentenceCounter();
  els.chapterLabel.textContent = chapter.title + ' · ' + count.at + '/' + count.total;

  const text = currentSentence();
  if(highlightChars > 0 && highlightChars < text.length){
    els.reading.innerHTML =
      '<span class="spoken">' + escapeHtml(text.slice(0, highlightChars)) + '</span>' +
      '<span class="pending">' + escapeHtml(text.slice(highlightChars)) + '</span>';
  } else {
    els.reading.textContent = text;
  }

  const block = currentBlock();
  const nextBlk = chapter.blocks[blockIndex + 1];
  els.upNext.textContent = block.sentences[sentenceIndex + 1]
    || (nextBlk && nextBlk.sentences[0]) || '';
  savePosition();
}

function announce(msg){ els.status.textContent = msg; }

function nextBlockPosition(c, b){
  if(b + 1 < book.chapters[c].blocks.length) return { c, b: b + 1 };
  if(c + 1 < book.chapters.length) return { c: c + 1, b: 0 };
  return null;
}

async function playFromHere(){
  unlockAudio();
  playing = true;
  els.playBtn.textContent = '\u275a\u275a Зогсоох';
  els.status.textContent = '';

  while(playing && chapterIndex < book.chapters.length){
    render(0);
    let clip;
    try{
      clip = await getClip(chapterIndex, blockIndex);
    }catch(e){
      if(playing){ announce('Хоолой уншиж чадсангүй. Интернэтээ шалгана уу.'); stopPlayback(); }
      return;
    }
    if(!playing) return;

    const upcoming = nextBlockPosition(chapterIndex, blockIndex);
    if(upcoming) getClip(upcoming.c, upcoming.b).catch(()=>{});

    const from = clip.boundaries.find(b => b.sentence === sentenceIndex);
    try{
      await playClip(clip, from ? from.time : 0);
    }catch(e){
      if(playing){ announce('Дуу тоглуулж чадсангүй. Дахин "Унших" дарна уу.'); stopPlayback(); }
      return;
    }
    if(!playing) return;

    if(!upcoming){ stopPlayback(); announce('Ном дууслаа.'); return; }
    const newChapter = upcoming.c !== chapterIndex;
    chapterIndex = upcoming.c; blockIndex = upcoming.b; sentenceIndex = 0;
    if(newChapter) announce(currentChapter().title);

    const after = nextBlockPosition(chapterIndex, blockIndex);
    clearClips([clipKey(chapterIndex, blockIndex)].concat(after ? [clipKey(after.c, after.b)] : []));
  }
}

function stopPlayback(){
  playing = false;
  try{ audioEl.pause(); }catch(e){}
  els.playBtn.textContent = '\u25b6 Унших';
  render();
}

function goSentence(delta){
  const wasPlaying = playing;
  stopPlayback();
  let c = chapterIndex, b = blockIndex, s = sentenceIndex + delta;
  while(s < 0){
    if(b > 0){ b--; s += book.chapters[c].blocks[b].sentences.length; }
    else if(c > 0){ c--; b = book.chapters[c].blocks.length - 1; s += book.chapters[c].blocks[b].sentences.length; }
    else { s = 0; break; }
  }
  while(s >= book.chapters[c].blocks[b].sentences.length){
    const len = book.chapters[c].blocks[b].sentences.length;
    if(b + 1 < book.chapters[c].blocks.length){ s -= len; b++; }
    else if(c + 1 < book.chapters.length){ s -= len; c++; b = 0; }
    else { s = len - 1; break; }
  }
  chapterIndex = c; blockIndex = b; sentenceIndex = s;
  render();
  if(wasPlaying) playFromHere();
}

function goChapter(delta){
  const wasPlaying = playing;
  stopPlayback();
  const target = chapterIndex + delta;
  if(target < 0 || target >= book.chapters.length) return;
  chapterIndex = target; blockIndex = 0; sentenceIndex = 0;
  render();
  announce(currentChapter().title);
  if(wasPlaying) playFromHere();
}

function jumpToChapter(i){
  stopPlayback();
  chapterIndex = i; blockIndex = 0; sentenceIndex = 0;
  render();
  els.tocPanel.classList.add('hidden');
  playFromHere();
}

function repeatParagraph(){
  stopPlayback();
  sentenceIndex = 0;
  render();
  playFromHere();
}

// ---- Controls ----
els.playBtn.addEventListener('click', () => { playing ? stopPlayback() : playFromHere(); });
els.prevBtn.addEventListener('click', () => goSentence(-1));
els.nextBtn.addEventListener('click', () => goSentence(1));

function updateSpeedLabel(){
  els.speedBtn.textContent = 'Хурд ' + SPEEDS[speedIndex].toFixed(2).replace(/0$/,'') + '×';
}
els.speedBtn.addEventListener('click', () => {
  speedIndex = (speedIndex + 1) % SPEEDS.length;
  try{ localStorage.setItem('gerel:speed', String(speedIndex)); }catch(e){}
  updateSpeedLabel();
  clearClips();
  announce('Хурд: ' + SPEEDS[speedIndex] + '×');
  if(playing){ stopPlayback(); playFromHere(); }
});
updateSpeedLabel();

function updateReaderLabel(){
  els.readerBtn.textContent = 'Хоолой: ' + READERS[readerIndex].label;
}
els.readerBtn.addEventListener('click', () => {
  readerIndex = (readerIndex + 1) % READERS.length;
  try{ localStorage.setItem('gerel:reader', String(readerIndex)); }catch(e){}
  updateReaderLabel();
  clearClips();
  announce('Хоолой: ' + READERS[readerIndex].label);
  if(playing){ stopPlayback(); playFromHere(); }
});
updateReaderLabel();

els.tocBtn.addEventListener('click', () => els.tocPanel.classList.remove('hidden'));
els.tocCloseBtn.addEventListener('click', () => els.tocPanel.classList.add('hidden'));
els.shelfBtn.addEventListener('click', () => { stopPlayback(); els.shelf.classList.remove('hidden'); });

let touchX = null;
document.addEventListener('touchstart', e => { touchX = e.changedTouches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e => {
  if(touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  touchX = null;
  if(!els.shelf.classList.contains('hidden')) return;
  if(Math.abs(dx) > 90) goChapter(dx < 0 ? 1 : -1);
}, {passive:true});

document.addEventListener('keydown', e => {
  if(!els.shelf.classList.contains('hidden')) return;
  if(e.code === 'Space'){ e.preventDefault(); playing ? stopPlayback() : playFromHere(); }
  if(e.code === 'ArrowRight') goSentence(1);
  if(e.code === 'ArrowLeft') goSentence(-1);
  if(e.code === 'ArrowDown') goChapter(1);
  if(e.code === 'ArrowUp') goChapter(-1);
});

// ---- Voice commands (English) ----
let recognition = null, listening = false, voiceReady = false;

function setupVoiceCommands(){
  if(voiceReady) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    els.voiceBtn.disabled = true;
    els.voiceBtn.textContent = 'Дуут удирдлага байхгүй';
    return;
  }
  voiceReady = true;
  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = false;
  recognition.lang = 'en-US';

  recognition.onresult = e => {
    const said = e.results[e.results.length - 1][0].transcript.toLowerCase().trim();
    if(/\bnext chapter\b/.test(said)) goChapter(1);
    else if(/\b(previous|last) chapter\b/.test(said)) goChapter(-1);
    else if(/\b(next|forward)\b/.test(said)) goSentence(1);
    else if(/\b(previous|back|last)\b/.test(said)) goSentence(-1);
    else if(/\b(stop|pause)\b/.test(said)) stopPlayback();
    else if(/\b(play|read|start|continue)\b/.test(said)){ if(!playing) playFromHere(); }
    else if(/\b(repeat|again)\b/.test(said)) repeatParagraph();
    else return;
    announce('Command: ' + said);
  };
  recognition.onend = () => { if(listening) recognition.start(); };
  recognition.onerror = ev => {
    if(ev.error === 'not-allowed'){
      listening = false;
      els.voiceBtn.textContent = 'Дуут удирдлага';
      announce('Микрофон зөвшөөрөгдөөгүй.');
    }
  };

  els.voiceBtn.addEventListener('click', () => {
    listening = !listening;
    if(listening){
      try{ recognition.start(); }catch(e){}
      els.voiceBtn.textContent = 'Сонсож байна ●';
      announce('Say: play, stop, next, previous, repeat, next chapter');
    } else {
      recognition.stop();
      els.voiceBtn.textContent = 'Дуут удирдлага';
    }
  });
}

function buildToc(){
  els.tocList.innerHTML = '';
  book.chapters.forEach((ch, i) => {
    const b = document.createElement('button');
    b.className = 'tocItem' + (i === chapterIndex ? ' current' : '');
    b.textContent = (i + 1) + '. ' + ch.title;
    b.addEventListener('click', () => jumpToChapter(i));
    els.tocList.appendChild(b);
  });
}

function afterBookLoaded(autoPlay){
  els.bookTitle.textContent = book.title;
  els.bookAuthor.textContent = book.author;
  const resumed = restorePosition();
  buildToc();
  render();
  [els.playBtn, els.prevBtn, els.nextBtn, els.tocBtn, els.voiceBtn].forEach(b => b.disabled = false);
  setupVoiceCommands();
  els.shelf.classList.add('hidden');
  announce(resumed ? 'Уншиж байсан газраас үргэлжилнэ.' : book.chapters.length + ' бүлэгтэй.');
  if(autoPlay) playFromHere();
}

// ============================================================
// Shelf — the catalogue
// ============================================================
// A blind child cannot scan a list of covers, so the shelf speaks. Tap a book
// once to hear its title, tap again to open it. That is the same rhythm as a
// screen reader, and it lets a child choose rather than be handed something.
let shelfBooks = [];      // flat list, for keyboard and the surprise button
let shelfPick = -1;

function speakTitleSoon(text){
  clearTimeout(speakTitleSoon._t);
  speakTitleSoon._t = setTimeout(() => say(text), 250);
}

function markPick(i){
  document.querySelectorAll('.bookRow').forEach(el => el.classList.remove('on'));
  const row = document.querySelector('.bookRow[data-i="' + i + '"]');
  if(row){
    row.classList.add('on');
    row.scrollIntoView({ block:'center', behavior:'smooth' });
  }
  shelfPick = i;
}

async function openShelfBook(entry, autoPlay){
  els.shelfNote.classList.remove('hidden');
  els.shelfNote.textContent = 'Ном нээж байна…';
  try{
    const res = await fetch(entry.file);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    await loadEpub(await res.arrayBuffer(), entry.title);
    try{ localStorage.setItem('gerel:last', JSON.stringify(entry)); }catch(e){}
    els.shelfNote.classList.add('hidden');
    afterBookLoaded(autoPlay);
  }catch(err){
    els.shelfNote.textContent = 'Нээж чадсангүй: ' + err.message;
    console.error(err);
  }
}

function renderShelf(catalog){
  els.shelfList.innerHTML = '';
  shelfBooks = [];

  (catalog.shelves || []).forEach(group => {
    const books = (group.books || []).filter(b => b && b.title && b.file);
    if(!books.length) return;

    const wrap = document.createElement('div');
    wrap.className = 'shelfGroup';
    const h = document.createElement('h2');
    h.textContent = group.name || '';
    wrap.appendChild(h);

    books.forEach(entry => {
      const i = shelfBooks.length;
      shelfBooks.push(entry);

      const row = document.createElement('button');
      row.className = 'bookRow';
      row.dataset.i = i;
      row.innerHTML = escapeHtml(entry.title)
        + (entry.author ? '<span class="who">' + escapeHtml(entry.author) + '</span>' : '');

      row.addEventListener('click', () => {
        unlockAudio();
        if(shelfPick === i){
          openShelfBook(entry, true);        // second tap opens
        } else {
          markPick(i);
          speakTitleSoon(entry.title);       // first tap reads it aloud
        }
      });
      wrap.appendChild(row);
    });
    els.shelfList.appendChild(wrap);
  });

  if(catalog.credit){
    els.shelfCredit.textContent = catalog.credit;
  }

  if(!shelfBooks.length){
    els.shelfNote.classList.remove('hidden');
    els.shelfNote.textContent =
      'Номын жагсаалт хоосон байна. Доороос өөрийн ном нээж болно.';
    els.surpriseBtn.disabled = true;
  }
}

// Move through the shelf with the keyboard too, speaking as it goes.
document.addEventListener('keydown', e => {
  if(els.shelf.classList.contains('hidden')) return;
  if(!shelfBooks.length) return;
  if(e.code === 'ArrowDown' || e.code === 'ArrowUp'){
    e.preventDefault();
    const step = e.code === 'ArrowDown' ? 1 : -1;
    const i = Math.max(0, Math.min(shelfBooks.length - 1, (shelfPick < 0 ? 0 : shelfPick + step)));
    markPick(i);
    speakTitleSoon(shelfBooks[i].title);
  }
  if(e.code === 'Enter' && shelfPick >= 0){
    e.preventDefault();
    openShelfBook(shelfBooks[shelfPick], true);
  }
});

els.surpriseBtn.addEventListener('click', () => {
  unlockAudio();
  if(!shelfBooks.length) return;
  const i = Math.floor(Math.random() * shelfBooks.length);
  markPick(i);
  openShelfBook(shelfBooks[i], true);
});

els.resumeBtn.addEventListener('click', () => {
  unlockAudio();
  try{
    const last = JSON.parse(localStorage.getItem('gerel:last') || 'null');
    if(last && last.file) openShelfBook(last, true);
  }catch(e){}
});

// Opening a book from the device still works, catalogue or not.
els.fileInput.addEventListener('change', async e => {
  const file = e.target.files[0];
  if(!file) return;
  unlockAudio();
  els.shelfNote.classList.remove('hidden');
  els.shelfNote.textContent = 'Ном нээж байна…';
  try{
    await loadEpub(file, file.name);
    els.shelfNote.classList.add('hidden');
    afterBookLoaded(false);
  }catch(err){
    els.shelfNote.textContent = 'Нээж чадсангүй: ' + err.message;
    console.error(err);
  }
});
document.getElementById('openFileLabel').addEventListener('keydown', e => {
  if(e.code === 'Enter' || e.code === 'Space'){ e.preventDefault(); els.fileInput.click(); }
});

// ---- Start up ----
(async function init(){
  try{
    const last = JSON.parse(localStorage.getItem('gerel:last') || 'null');
    if(last && last.title){
      els.resumeBtn.classList.remove('hidden');
      els.resumeBtn.textContent = 'Үргэлжлүүлэх';
    }
  }catch(e){}

  try{
    const res = await fetch('catalog.json', { cache: 'no-store' });
    if(res.ok) renderShelf(await res.json());
    else renderShelf({ shelves: [] });
  }catch(e){
    renderShelf({ shelves: [] });
  }
})();
</script>
