// Only shelves meant for children. A shelf marked forChildren:false — such as
// "Хасагдсан", where books taken off on 2 Oct wait — must not leak its books
// into "random", "Богино ном", favourites or Continue.
const allBooks=()=>{
  const m=new Map();
  (catalog?.shelves||[]).filter(g=>g.forChildren!==false).forEach(g=>(g.books||[]).forEach(b=>{
    if(b&&b.title&&b.file&&!m.has(b.file)) m.set(b.file,b); }));
  return [...m.values()];
};
const everyBook=()=>allBooks().filter(reachable);

// ============================================================
// Books in parts
// ============================================================
// "ШААЛУУ ХҮҮ МАУГЛИ - 2", "МОНТЕ-КРИСТО ГҮН 4", "НУУЦАТ АРАЛ - 1 : АЮУЛД
// УЧРАГСАД", "ИРГЭНИЙ БОЛОВСРОЛ X": the part is in the title. Read here rather
// than stored, so a book added later joins its series on its own. Checked
// against all 344 titles: 34 series, no false matches.
const ROMAN={I:1,II:2,III:3,IV:4,V:5,VI:6,VII:7,VIII:8,IX:9,X:10,XI:11,XII:12};
function partOf(title){
  const m=String(title||'').toUpperCase().trim()
    .match(/^(.+?)\s*(?:[-–—]\s*|\s)(\d{1,2}|[IVX]{1,4})\s*(?:[:(].*)?$/);
  if(!m) return null;
  const n=/^\d+$/.test(m[2])?+m[2]:ROMAN[m[2]];
  if(!n) return null;
  // Latin letters that look Cyrillic ("ЭX") are folded, so a spelling slip
  // does not split a series in two.
  const key=m[1].replace(/[ABCEHKMOPTXY]/g,c=>'АВСЕНКМОРТХУ'['ABCEHKMOPTXY'.indexOf(c)])
                .replace(/[^\p{L}\p{N}]/gu,'');
  return key?{key,n}:null;
}
let SERIES=null;                         // series key -> Map(part -> book)
function series(){
  if(SERIES) return SERIES;
  if(!catalog) return new Map();
  SERIES=new Map();
  allBooks().forEach(b=>{
    const p=partOf(b.title); if(!p) return;
    if(!SERIES.has(p.key)) SERIES.set(p.key,new Map());
    SERIES.get(p.key).set(p.n,b);
  });
  return SERIES;
}
// A part is shown only when every part before it is in the library. A lone
// "МОНТЕ-КРИСТО ГҮН 4" drops a child into the middle of a story with no way
// back to its beginning. It comes back by itself once the earlier parts are
// added — 14 books are waiting on this.
function reachable(b){
  const p=partOf(b&&b.title); if(!p) return true;
  const parts=series().get(p.key);
  if(!parts) return true;
  for(let i=1;i<p.n;i++) if(!parts.has(i)) return false;
  return true;
}
function nextPart(b){
  const p=partOf(b&&b.title); if(!p) return null;
  const parts=series().get(p.key);
  return (parts&&parts.get(p.n+1))||null;
}
// The end of one part opens the next, as one book would: a child should not
// have to find volume 2 on a shelf by ear to hear how the story goes on.
async function continueSeries(next){
  const r=await announceParts(['Ном дууслаа.','Дараагийн боть']);
  if(r==='cut') return;                  // the child has done something else
  await openBook(next,{play:true});
}

function shelvesOf(){
  const base=(catalog?.shelves||[]).filter(g=>g.forChildren!==false)
    .map(g=>Object.assign({},g,{books:(g.books||[]).filter(reachable)}))
    .filter(g=>g.books.some(b=>b&&b.title&&b.file));
  const f=everyBook().filter(b=>isFav(b.file));
  // "Богино ном" (books of a quarter of an hour or less) was taken off the
  // first screen on 3 Oct, at the user's wish, with "Том хүүхдэд".
  return f.length?[{name:'Миний ном',books:f}].concat(base):base;
}
const mins=m=>m<60?m+' минут':(m%60?Math.floor(m/60)+' цаг '+(m%60)+' минут':Math.floor(m/60)+' цаг');
const begun=t=>!!get('pos:'+t,'');

// Eighty-six titles in one scroll is unusable by eye and worse by ear, so the
// list can be ordered three ways and jumped into by letter.
// English books carry a level (1 = first steps … 4 = older learners), and
// А–Я keeps the easiest first, alphabetical within a level: a beginner should
// meet Aesop before Alice. Books with no level are unaffected.
const SORTS=[
  ['А–Я', (a,b)=> ((a.level||0)-(b.level||0)) || (letterField==='author'
      ? (authorKey(a)||titleKey(a)).localeCompare(authorKey(b)||titleKey(b),'mn')
      : titleKey(a).localeCompare(titleKey(b),'mn'))],
  ['Богино эхэлж', (a,b)=>(a.minutes||0)-(b.minutes||0)],
  ['Урт эхэлж',    (a,b)=>(b.minutes||0)-(a.minutes||0)],
];
let sortIndex=parseInt(get('sort','0'),10); if(isNaN(sortIndex)||!SORTS[sortIndex]) sortIndex=0;
let letterPick='';
// Which field the alphabet works on. Remembered, because a teacher who
// searches by author will do it again tomorrow.
let letterField=get('lfield','title');

const MN_LETTERS='АБВГДЕЁЖЗИЙКЛМНОӨПРСТУҮФХЦЧШЩЭЮЯ'.split('');
const firstLetter=t=>((t||'').trim().charAt(0)||'').toUpperCase();
// Mongolian names carry the father's initial in front — Л. Чойжилсүрэн —
// so the first character is not the name at all. Filing him under Л would
// put half the library under four letters. Any run of single letters
// followed by a full stop is dropped, which leaves ААЗ and ЮНЕСКО alone
// because neither has one.
const AUTHOR_INITIALS=/^(\s*[А-ЯЁӨҮA-Z]\s*[.．]\s*)+/;
const authorName=x=>String(x||'').replace(AUTHOR_INITIALS,'').trim();
// English books are filed under Latin letters the way an English library
// shelves them: a title without its leading "The", "A" or "An" (The Tale of
// Peter Rabbit under T for Tale), an author under the surname (Beatrix
// Potter under P, Brothers Grimm under G). Without this the letter row on
// the English shelf was empty.
const EN_LETTERS='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const titleKey=b=>{ const t=String(b.title||'').trim();
  return b.lang==='en' ? t.replace(/^(the|an?)\s+/i,'') : t; };
const authorKey=b=>{ if(b.lang!=='en') return authorName(b.author);
  const w=String(b.author||'').trim().split(/\s+/); return w[w.length-1]||''; };
// A book with no author still has to appear somewhere, so it falls back to
// its title rather than vanishing from the author alphabet.
const keyOf=b=>firstLetter(letterField==='author'
  ? (authorKey(b) || titleKey(b)) : titleKey(b));

let letterCounts={};
const countFor=L=>letterCounts[L]||0;

function renderLetters(books){
  letterCounts={};
  books.forEach(b=>{ const L=keyOf(b); letterCounts[L]=(letterCounts[L]||0)+1; });
  const box=$('letters');
  box.innerHTML='';
  if(!books.length) return;
  const present=new Set(books.map(b=>keyOf(b)));
  MN_LETTERS.concat(EN_LETTERS).filter(L=>present.has(L)).forEach(L=>{
    const b=document.createElement('button');
    b.textContent=L;
    if(L===letterPick) b.className='on';
    // Spoken on hover and on focus, so a child sweeping across with arrows
    // hears each letter rather than having to see it.
    const speak=()=>{ if(present.has(L)) say(L); };
    b.addEventListener('mouseenter',onHover(speak));
    b.addEventListener('mouseleave',()=>clearTimeout(hoverT));
    b.addEventListener('focus',speak);
    b.addEventListener('click',()=>{
      if(!present.has(L)){ say(L+'. Ном алга.'); return; }
      letterPick = (letterPick===L) ? '' : L;
      renderShelf();
      announce(letterPick || 'Бүх ном');
      // Land on the books, so the next arrow press moves through them.
      setTimeout(()=>{ const bands=shelfBands();
        const bl=bands.indexOf($('bookList'));
        if(bl>=0 && letterPick) enterBand(bands,bl,0); }, 60);
    });
    box.appendChild(b);
  });
}

const FIELDS=[['title','Номын нэр'],['author','Зохиогчийн нэр']];
function renderFields(){
  const box=$('fieldRow');
  box.innerHTML='';
  FIELDS.forEach(([k,label])=>{
    const b=document.createElement('button');
    b.textContent=label;
    if(letterField===k) b.className='on';
    b.addEventListener('focus',()=>say(label));
    b.addEventListener('mouseenter',onHover(()=>say(label)));
    b.addEventListener('mouseleave',()=>clearTimeout(hoverT));
    b.addEventListener('click',()=>{
      letterField=k; put('lfield',k);
      letterPick='';                 // the old letter means nothing now
      renderShelf();
      announce(label);
    });
    box.appendChild(b);
  });
}

function renderShelf(){
  const L=$('shelfList'), B=$('bookList');
  L.innerHTML=''; B.innerHTML=''; rows=[]; pick=-1;
  $('shelfNote').classList.add('hidden');

  $('shelf').classList.toggle('home',openShelf===null);
  if(openShelf===null){
    $('letters').innerHTML='';
    $('fieldRow').innerHTML='';
    letterPick='';
    $('shelfTitle').textContent='Тавиурууд';
    if(catalog) showContinue();
    const list=shelvesOf();
    list.forEach((g,i)=>{
      const n=(g.books||[]).filter(b=>b&&b.title&&b.file).length;
      const c=document.createElement('button');
      c.className='shelfCard';
      const st=SHELF_STYLE[g.name];
      // The colour only: the light and the sun drawn over it are in the CSS.
      c.style.backgroundColor=st?st[0]:COLOURS[i%COLOURS.length];
      c.innerHTML='<span class="sic">'+SHELF_ICONS[st?st[1]:'book']+'</span>'
        +'<span class="nm">'+esc(g.name)+'</span><span class="ct">'+n+' ном</span>';
      const speak=(noScroll)=>{ pick=i; hi(L,i,true,noScroll); say(g.name); };
      c.addEventListener('mouseenter',onHover(()=>speak(true)));
      c.addEventListener('mouseleave',()=>clearTimeout(hoverT));
      c.addEventListener('focus',()=>speak(false));
      c.addEventListener('click',()=>{ unlock(); earcon('open'); openShelf=i; renderShelf(); announce(g.name); });
      L.appendChild(c);
    });
    if(!list.length){
      $('shelfNote').classList.remove('hidden');
      $('shelfNote').textContent='Ном алга байна. Доороос өөрийн ном нээж болно.';
    }
    return;
  }

  const g=shelvesOf()[openShelf];
  if(!g){ openShelf=null; renderShelf(); return; }
  $('shelfTitle').textContent=g.name;
  $('backChip').textContent='← Тавиурууд';
  let all=(g.books||[]).filter(b=>b&&b.title&&b.file);
  renderFields();
  renderLetters(all);
  if(letterPick) all=all.filter(b=>keyOf(b)===letterPick);
  all=all.slice().sort(SORTS[sortIndex][1]);
  all.forEach((e,i)=>{
    rows.push(e);
    const r=document.createElement('div');
    r.className='bookRow'; r.dataset.i=i;
    const cov=e.cover
      ?'<span class="cover"><img src="'+esc(e.cover)+'" alt="" loading="lazy"></span>'
      :'<span class="cover">'+esc((e.title||'?').trim().charAt(0))+'</span>';
    r.innerHTML=cov
      +'<button class="meta"><span class="t">'+esc(e.title)
      +(begun(e.title)?'<span class="mark">эхэлсэн</span>':'')+'</span>'
      +(e.author?'<span class="who">'+esc(e.author)+'</span>':'')
      +(e.minutes?'<span class="len">'+mins(e.minutes)+'</span>':'')+'</button>'
      +(e.braille?'<a class="brl" href="'+esc(e.braille)+'" download '
        +'aria-label="Брайль татах'+(e.braillePages?', '+e.braillePages+' хуудас':'')
        +'">⠃</a>':'')
      +'<button class="keepBtn'+(me?'':' hidden')+'" aria-label="Татах">⤓</button>'
      +'<button class="star'+(isFav(e.file)?' is':'')+'" aria-label="Дуртай">★</button>';
    // Title and author together: a child cannot tell three books called
    // "Үлгэрүүд" apart, and the author is how a library distinguishes them.
    const speak=(noScroll)=>{ pick=i; hi(B,i,true,noScroll);
      say(e.author ? e.title + '. ' + e.author : e.title); };
    const meta=r.querySelector('.meta');
    meta.addEventListener('click',()=>{ unlock(); openBook(e); });
    meta.addEventListener('mouseenter',onHover(()=>speak(true)));
    meta.addEventListener('mouseleave',()=>clearTimeout(hoverT));
    meta.addEventListener('focus',()=>speak(false));
    const brl=r.querySelector('.brl');
    if(brl){
      // Downloading is silent, which on a page that talks reads as a failure.
      brl.addEventListener('focus',()=>say('Брайль татах'));
      brl.addEventListener('mouseenter',onHover(()=>say('Брайль татах')));
      brl.addEventListener('click',ev=>{ ev.stopPropagation();
        announce('Брайль файл татагдаж байна.'); });
    }
    const keep=r.querySelector('.keepBtn');
    if(keep){
      isKept(e).then(yes=>{ if(yes) keep.classList.add('is'); });
      keep.addEventListener('focus',()=>say('Татах'));
      keep.addEventListener('mouseenter',onHover(()=>say('Татах')));
      keep.addEventListener('click',async ev=>{
        ev.stopPropagation();
        if(!me){ show('login'); $('loginUser').focus(); return; }
        if(keep.classList.contains('is')){
          await forgetBook(e); keep.classList.remove('is');
          earcon('back'); announce('Утаснаас устгалаа.'); return;
        }
        keep.disabled=true;
        announce('Татаж байна…');
        try{
          await keepBook(e,(done,all)=>{ keep.textContent=Math.round(done/all*100)+'%'; });
          keep.textContent='⤓'; keep.classList.add('is');
          earcon('done'); announce('Утсанд хадгаллаа. Интернэтгүй сонсож болно.');
        }catch(err){
          keep.textContent='⤓';
          console.warn('Gerel: download failed for', e.id, err);
          earcon('fail'); announce('Татаж чадсангүй.');
        }finally{ keep.disabled=false; }
      });
    }
    r.querySelector('.star').addEventListener('click',ev=>{
      ev.stopPropagation();
      favs=isFav(e.file)?favs.filter(x=>x!==e.file):favs.concat([e.file]);
      put('favs',JSON.stringify(favs));
      ev.currentTarget.classList.toggle('is');
      earcon(isFav(e.file)?'done':'back');
      announce(isFav(e.file)?'Дуртай номонд нэмлээ.':'Дуртай номноос хаслаа.');
    });
    B.appendChild(r);
  });
}
// A shelf is three bands stacked: the two field buttons, the alphabet, the
// books. The first screen is three too: Continue, the three ways of reading,
// the shelves. Empty or hidden bands are left out, so the arrows never land
// somewhere with nothing in it.
function shelfBands(){
  const list = openShelf===null
    ? [$('contRow'), $('modeRow'), $('shelfList')]
    : [$('fieldRow'), $('letters'), $('bookList')];
  return list.filter(b=>b && b.children.length && b.getClientRects().length);
}
const BUTTON_BANDS=['fieldRow','letters','contRow','modeRow'];
// How many columns the CSS is actually using, so up and down move by a row
// whatever the screen width turns out to be.
function colsOf(box){
  try{
    const t=getComputedStyle(box).gridTemplateColumns;
    if(t && t!=='none') return t.split(' ').filter(Boolean).length || 1;
  }catch(e){}
  // The letters and the field buttons are a wrapping flex row, so measure
  // where the second line starts instead.
  const kids=[...box.children];
  if(kids.length<2) return kids.length||1;
  const top=kids[0].offsetTop;
  let n=0; for(const k of kids){ if(k.offsetTop!==top) break; n++; }
  return n||1;
}
function bandOf(bands){
  const el=document.activeElement;
  for(let i=0;i<bands.length;i++){
    if(el && el!==document.body && bands[i].contains(el)) return i;
    if(bands[i].querySelector('.bookRow.on,.shelfCard.on')
       && (!el || el===document.body)) return i;
  }
  return bands.findIndex(b=>b.querySelector('.bookRow.on,.shelfCard.on'));
}
function posIn(band,items){
  const el=document.activeElement;
  if(el && band.contains(el)){
    const i=items.indexOf(el.closest('#fieldRow>*,#letters>*,#contRow>*,#modeRow>*,.bookRow,.shelfCard'));
    if(i>=0) return i;
  }
  return items.findIndex(x=>x.classList.contains('on') &&
    (x.classList.contains('bookRow')||x.classList.contains('shelfCard')));
}
// Moving into a band: a button takes real focus, a card takes the outline.
// Either way it says what it is, which is the whole point.
function enterBand(bands,bi2,at){
  const band=bands[bi2];
  const items=[...band.children];
  if(!items.length) return;
  if(at<0) at=items.length+at;
  at=Math.max(0,Math.min(items.length-1,at));
  const el=items[at];
  // Whatever can hold focus inside this item announces itself: a book row
  // says "title. author", a shelf card says its name, a letter says the
  // letter. Speaking here as well would either double it or, as it did,
  // quietly drop the author.
  const own = el.querySelector('.meta') || (el.tagName==='BUTTON' ? el : null);
  if(own){
    pick = BUTTON_BANDS.includes(band.id) ? -1 : at;
    // Leaving the shelves or books for a row of buttons: no tile or row
    // should still look chosen.
    if(pick<0) document.querySelectorAll('.shelfCard.on,.bookRow.on')
      .forEach(x=>x.classList.remove('on'));
    own.focus();
  }else{
    try{ document.activeElement.blur(); }catch(e){}
    pick=at;
    hi(band,at,true);
    const t=el.querySelector('.nm,.t');
    say(t ? t.textContent : el.textContent);
  }
  el.scrollIntoView({block:'nearest'});
}

function hi(container,i,fast,noScroll){
  container.querySelectorAll('.shelfCard,.bookRow').forEach(x=>x.classList.remove('on'));
  const sel=container.children[i];
  if(!sel) return;
  sel.classList.add('on');
  // Scrolling on hover made the list fight the mouse wheel: each row passing
  // under the pointer re-centred the page. The pointer needs no help finding
  // a row it is already on — only the keyboard does.
  if(!noScroll) sel.scrollIntoView({block:'center',behavior:fast?'auto':'smooth'});
}

// Speaking on hover has the same problem in the ear: rows sweeping past the
// pointer start and cut off a dozen titles. Wait for the pointer to settle.
let hoverT=null;
function onHover(fn){
  return ()=>{ clearTimeout(hoverT); hoverT=setTimeout(fn,140); };
}

// opts.play: start the voice whatever the mode (the next part of a series).
// opts.resume: go straight back to where the child stopped, without asking —
// the Continue button has already asked.
async function openBook(e, opts={}){
  hush();                       // stop the title being read over the last one
  earcon('open');
  // Clear the previous book first. Without this a book that fails to open
  // leaves the last one's chapters in place under the new one's title, and a
  // child hears the wrong story.
  stop();
  // And empty the clip cache. Its keys are chapter:block only, with nothing
  // identifying the book, so the new book's first paragraph asked for "0:0"
  // and was handed the PREVIOUS book's recording — the child heard the old
  // story under the new title.
  dropClips();
  book.entry=e; book.chapters=[]; book.audioBase=null;
  book.title=''; book.author='';
  ci=0; bi=0; si=0; resumeT=0;
  $('shelfNote').classList.remove('hidden');
  $('shelfNote').textContent='Ном нээж байна…';
  try{
    try{ await loadVoiced(e); }
    catch(x){
      // The EPUBs are on R2 beside the audio since 3 Oct (catalogue
      // "booksBase"); one added later through the admin page is still in the
      // site, so that is tried next.
      let r=null;
      if(catalog && catalog.booksBase)
        r=await fetch(catalog.booksBase.replace(/\/+$/,'')+'/'+e.file).catch(()=>null);
      if(!r || !r.ok) r=await fetch(e.file);
      if(!r.ok) throw new Error('unavailable');
      await loadEpub(await r.arrayBuffer(), e.title);
    }
    put('last',JSON.stringify(e));
    $('nowCoverImg').src=$('resumeCover').src=e.cover||'logo.png';
    $('shelfNote').classList.add('hidden');
    $('playerStatus').classList.add('hidden');
    $('bookTitle').textContent=book.title;
    buildToc();
    // Opened from its twin at one chapter: straight there, no question.
    if(opts.ch!==undefined && book.chapters[opts.ch]){
      ci=opts.ch; bi=Math.max(0,book.chapters[ci].blocks.findIndex(x=>!x.skip)); si=0; resumeT=0;
      paint(); show(mode==='read'?'reader':'player'); media();
      announce(chap().title);
      if(mode!=='read') play();
      return;
    }
    // A book already begun asks rather than assuming. Dropping a child into
    // the middle of a story with no explanation is disorienting when you
    // cannot see the page.
    if(loadPos()){
      if(opts.resume){ openAt(false); return; }
      paint();
      $('resumeTitle').textContent = book.title;
      $('resumeWhere').textContent = chap().title;
      show('resume');
      $('resumeGo').focus();
      announce('Үргэлжлүүлэх үү, эхнээс нь үү?');
      return;
    }
    ({c:ci,b:bi}=firstPlace()); si=0; paint();
    show(mode==='read'?'reader':'player');
    media();
    announce(book.title);
    if(mode==='listen' || (opts.play && mode!=='read')) play();
  }catch(err){
    $('shelfNote').textContent='Энэ ном хараахан бэлэн болоогүй байна. Өөр ном сонгоно уу.';
    earcon('fail'); say('Энэ ном хараахан бэлэн болоогүй байна.');
    console.error(err);
  }
}

function buildToc(){
  $('tocList').innerHTML='';
  bookmarks().forEach(m=>{
    const b=document.createElement('button');
    const c=book.chapters[m.ci];
    b.className='bookRow'; b.style.display='block'; b.style.padding='18px';
    b.innerHTML='<span class="t">★ Хавчуурга — '+chNo(m.ci)+'. '+esc(c.title)+'</span>';
    b.addEventListener('click',()=>{ earcon('open'); goBookmark(m); });
    b.addEventListener('focus',()=>sayParts(['Хавчуурга', chNo(m.ci)+'-р бүлэг', c.title]));
    $('tocList').appendChild(b);
  });
  book.chapters.forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='bookRow'; b.style.display='block'; b.style.padding='18px';
    if(c.hidden) return;                    // a contents page: not a chapter to go to
    b.dataset.ch=String(i);
    b.innerHTML='<span class="t">'+chNo(i)+'. '+esc(c.title)+'</span>';
    b.addEventListener('click',()=>{ earcon('open'); jump(i); });
    // The number is always voiced; the title only where it has been, so a
    // chapter is never silent.
    b.addEventListener('focus',()=>sayParts([chNo(i)+'-р бүлэг', c.title]));
    $('tocList').appendChild(b);
  });
}

// the keys and the screen's buttons — and the one this device uses opens:
// the buttons on a touch screen, the keys where there is a keyboard. The

// "Where am I?" — the question a child asks most, and the one a screen cannot
// answer to someone who cannot see it.
// Returned as pieces for sayParts, each one a recorded clip: "37 ном" and
// "5-р бүлэг" are voiced for every number, so any shelf and chapter can be said.
function whereAmI(){
  if(!$('shelf').classList.contains('hidden')){
    if(openShelf===null) return ['Тавиурууд', shelvesOf().length+' тавиур'];
    const g=shelvesOf()[openShelf];
    const n=(g.books||[]).length;
    // The book the child is on, by name: more use to them than its number.
    const on=pick>=0 && rows[pick];
    return [g.name, n ? n+' ном' : 'Ном алга байна.', on ? on.title : ''];
  }
  if(!book.chapters.length) return ['Ном сонгоогүй байна.'];
  return [(book.entry && book.entry.title) || book.title, chNo(ci)+'-р бүлэг', chap().title]
    .concat(leftParts());
}

// Turning the page. Reading a book without them meant using the chapter list
// for every page, which is no way to read a story.
function turn(d){
  const t=chapterFrom(ci,d);
  if(t<0){
    // Turning past the last page of a part opens the next, as when listening.
    const next=d>0&&nextPart(book.entry);
    if(next){ earcon('done'); continueSeries(next); return; }
    earcon('bump'); announce(d>0?'Ном дууслаа.':'Эхлэл'); return;
  }
  const was=playing; stop();
  ci=t; bi=0; si=0; resumeT=0; paint(); buildRead();
  announceParts([chNo(ci)+'-р бүлэг', chap().title]);
  $('readText').scrollTop=0;
  if(was) play();
}

const JUMPS={

  'м':'mine','m':'mine',        // миний ном
  'с':'random','s':'random',    // санамсаргүй
  'б':'toc','b':'toc',          // бүлгүүд
  'у':'read','u':'read',        // унших
  'х':'speed','h':'speed',      // хурд
  'я':'where','y':'where',      // би хаана байна
  'л':'twin','l':'twin',        // нөгөө хэлээр (хэл)
  'ө':'theme','o':'theme',      // өнгө
  'ц':'mark','c':'mark',        // хавчуурга (цэг тавих)
  '?':'help','/':'help'
};
// A number keypad as a remote: a few dollars, and every key is found by feel.
// 8 2 4 6 are already the arrows, 0 and Enter choose, minus goes back. 5 —
// the key with the raised dot a finger finds without looking — asks "where am
// I?", and plus changes the speed. By key position (e.code), so it works with
// Num Lock on or off.
const PAD_JUMPS={Numpad5:'where', NumpadAdd:'speed'};
function doJump(what){
  switch(what){
    // The beginning and the shelves are one screen since 3 Oct.
    case 'home':
    case 'shelves':stop(); openShelf=null; renderShelf(); show('shelf'); announce('Тавиурууд'); break;
    case 'mine': {
      const i=shelvesOf().findIndex(g=>g.name==='Миний ном');
      if(i<0){ announce('Дуртай ном алга байна.'); break; }
      openShelf=i; renderShelf(); show('shelf'); announce('Миний ном'); break;
    }
    case 'random': {
      const all=everyBook().filter(b=>b.lang!=='en');   // a Mongolian story
      if(!all.length){ announce('Ном алга байна.'); break; }
      openBook(all[Math.floor(Math.random()*all.length)]); break;
    }
    case 'toc':   if(book.chapters.length){ earcon('open'); show('toc'); announce('Бүлгүүд'); } break;
    case 'read':  if(book.chapters.length){ show('reader'); announce('Том үсгээр'); } break;
    case 'speed': $('speedBtn').click(); break;
    case 'where': announceParts(whereAmI()); break;
    case 'twin':  openTwin(); break;
    case 'theme': nextTheme(); break;
    case 'mark':  addBookmark(); break;
    // One clip per line, so changing one line of the help needs only that
    // line re-voiced. Recording it as one long sentence is what went silent:
    // the list changed and the recording no longer matched.
    case 'help':  renderHelp(); show('help');
                  sayParts(KEYS.map(k=>k[0]+': '+k[1])); break;
  }
}

// The first thing a child hears. A child who has never been here is told how
// to move; one who has is told where they are, briefly. A browser allows no
// sound before the page is touched or a key pressed — unless the library is
// installed or used often — so the greeting is tried as the page opens and
// otherwise waits for that first touch. Until then the page was silent, and a
// blind child had no way to know anything was there.
const GREET_FIRST=['Сайн байна уу! Гэрэл хүүхдийн номын санд тавтай морил.',
  'Сумаар сонгоод Enter дарна уу.',
  'Тусламж хэрэгтэй бол асуултын тэмдэг дарна уу.'];
const GREET_AGAIN=['Гэрэл хүүхдийн номын сан','Тавиурууд'];
let greeted=false;
function greet(){
  if(greeted) return;
  greeted=true;
  // A child coming back to a book hears its title: Enter takes them to it.
  const back=get('greeted','') && lastBook();
  const words=!get('greeted','') ? GREET_FIRST
             : back ? ['Гэрэл хүүхдийн номын сан','Үргэлжлүүлэх',back.title] : GREET_AGAIN;
  sayParts(words).then(r=>{
    if(r==='blocked') greeted=false;          // try again on the first touch
    else if(r!=='silent') put('greeted','1');
  });
}
function firstTouch(e){
  if(greeted || !atHome()) return;
  unlock();
  const firstVisit=!get('greeted','');
  // A button touched, or a key that already speaks (an arrow, Enter), is a
  // child who knows what they are doing: let it through. On a first visit a
  // key is taken for the greeting instead, so a child pressing Enter to see
  // what happens does not land somewhere they never heard offered.
  if(e.type==='pointerdown'){
    if(e.target.closest && e.target.closest('button,a')){ greeted=true; return; }
    greet(); return;
  }
  const acts=/^(Arrow|Enter|NumpadEnter|Numpad[02468]|Space)/.test(e.code||'')
          || !!PAD_JUMPS[e.code] || !!(e.key && JUMPS[e.key.toLowerCase()]);
  if(firstVisit){ e.preventDefault(); e.stopImmediatePropagation(); greet(); return; }
  if(acts){ greeted=true; return; }
  e.preventDefault(); e.stopImmediatePropagation(); greet();
}
// Capture, so this runs before the keyboard handler below and can take the key.
document.addEventListener('keydown',firstTouch,true);
document.addEventListener('pointerdown',firstTouch,true);

// Printed so it is possible to tell which build is actually live, instead of
// guessing whether a fix reached the server.
console.log('Gerel build 2026-10-03-m');
let lastNav=0;
document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA)$/.test(e.target.tagName||'');
  if(PAD_JUMPS[e.code] && !typing && $('login').classList.contains('hidden')){
    e.preventDefault(); doJump(PAD_JUMPS[e.code]); return;
  }
  // Letters jump straight to a place, from anywhere except a text box.
  if(!e.ctrlKey && !e.altKey && !e.metaKey && e.key && e.key.length===1){
    const j=JUMPS[e.key.toLowerCase()];
    if(j && !/^(INPUT|TEXTAREA)$/.test((e.target.tagName||''))
         && $('login').classList.contains('hidden')){
      e.preventDefault(); doJump(j); return;
    }
  }
  if(!$('login').classList.contains('hidden')){
    // Typing a password must not fire the single-letter shortcuts.
    if(e.code==='Backspace'||e.code==='Delete'){ return; }
    if(e.code==='Escape'){ e.preventDefault(); show('shelf'); }
    return;
  }
  if(!$('help').classList.contains('hidden')){
    e.preventDefault();
    if(e.code!=='Tab') show(lastScreen);
    return;
  }
  // The resume question owns its keys while it is showing.
  if(!$('resume').classList.contains('hidden')){
    if(e.code==='ArrowLeft'||e.code==='ArrowRight'||e.code==='ArrowUp'||e.code==='ArrowDown'){
      e.preventDefault();
      const d=document.activeElement===$('resumeGo')?$('resumeStart'):$('resumeGo');
      d.focus(); say(d===$('resumeStart')?'Эхнээс нь':'Үргэлжлүүлэх');
    }
    if(e.code==='Enter'||e.code==='NumpadEnter'||e.code==='Numpad0'||e.code==='Space'){
      e.preventDefault();
      (document.activeElement===$('resumeStart')?$('resumeStart'):$('resumeGo')).click();
    }
    if(e.code==='Backspace'||e.code==='Delete'){ e.preventDefault(); show('shelf'); }
    return;
  }

  const back=e.code==='Backspace'||e.code==='Delete'||e.code==='NumpadSubtract';
  const enter=e.code==='Enter'||e.code==='NumpadEnter'||e.code==='Numpad0';
  const down=e.code==='ArrowDown'||e.code==='Numpad2';
  const up=e.code==='ArrowUp'||e.code==='Numpad8';
  const right=e.code==='ArrowRight'||e.code==='Numpad6';
  const left=e.code==='ArrowLeft'||e.code==='Numpad4';

  // Holding a key repeats at whatever rate the operating system uses — about
  // thirty a second. Every repeat re-rendered the list and started another
  // smooth scroll, so the books raced past and nothing could be heard. A held
  // key now moves about five a second, which is still quick to cross a shelf.
  if(e.repeat && (down||up||left||right)){
    const now=performance.now();
    if(now-lastNav<190){ e.preventDefault(); return; }
    lastNav=now;
  }

  if(!$('shelf').classList.contains('hidden')){
    const bands=shelfBands();
    if(!bands.length) return;

    // Where the keyboard is now. The two button bands hold real buttons, so
    // they carry their own focus; the grids are tracked with pick.
    let bi2=bandOf(bands);

    if(down||up||left||right){
      e.preventDefault();
      if(bi2<0){ enterBand(bands,0,0); return; }
      const band=bands[bi2];
      const items=[...band.children];
      const cols=colsOf(band);
      let at=posIn(band,items);
      if(at<0) at=0;

      if(left||right){
        const to=at+(right?1:-1);
        if(to>=0 && to<items.length){ enterBand(bands,bi2,to); return; }
        // Off the end of a row: wrap into the next band rather than stop,
        // so a child sweeping one direction always reaches everything.
        const nb=bi2+(right?1:-1);
        if(nb>=0 && nb<bands.length) enterBand(bands,nb,right?0:-1);
        else earcon('bump');
        return;
      }
      const to=at+(down?cols:-cols);
      if(to>=0 && to<items.length){ enterBand(bands,bi2,to); return; }
      if(down && bi2+1<bands.length){ enterBand(bands,bi2+1,0); return; }
      if(up && bi2-1>=0){ enterBand(bands,bi2-1,-1); return; }
      // Nowhere left to go: stay where we are rather than jumping about, and
      // bump, so the press is not met with silence.
      const stay=Math.max(0,Math.min(items.length-1,to));
      if(stay===at){ earcon('bump'); return; }
      enterBand(bands,bi2,stay);
      return;
    }

    if(enter){
      e.preventDefault();
      if(bi2<0) return;
      const band=bands[bi2], items=[...band.children];
      const at=posIn(band,items);
      if(at<0) return;
      const el=items[at];
      (el.querySelector('.meta')||el).click();
      return;
    }
    if(back){ e.preventDefault(); $('backChip').click(); }   // bumps on the first screen
    return;
  }
  if(!$('toc').classList.contains('hidden')){
    if(back||left){ e.preventDefault(); $('tocClose').click(); return; }
    // Up and down walk the chapters, each one spoken; right or Enter opens.
    // Without this the arrows did nothing here and the list could only be
    // crossed by sight.
    if(up||down){
      e.preventDefault();
      const items=[...$('tocList').children];
      if(!items.length) return;
      const was=items.indexOf(document.activeElement);
      // The first press lands on the chapter being read, not at the top of a
      // list that can run to hundreds.
      const at = was<0 ? Math.max(0,items.findIndex(x=>x.dataset.ch===String(ci)))
               : Math.max(0,Math.min(items.length-1,was+(down?1:-1)));
      // At either end, the bump: the same sound as the end of any list.
      if(at===was){ earcon('bump'); return; }
      items[at].focus();
      items[at].scrollIntoView({block:'nearest'});
      return;
    }
    if(right){
      e.preventDefault();
      const a=document.activeElement;
      if(a && a.parentElement===$('tocList')) a.click();
    }
    return;
  }
  if(e.code==='Space'||enter){ e.preventDefault(); playing?stop():play(); }
  if(right) step(1);
  if(left) step(-1);
  if(down){ e.preventDefault(); const k=chapterFrom(ci,1); if(k>=0) jump(k); else earcon('bump'); }
  if(up){ e.preventDefault(); const k=chapterFrom(ci,-1); if(k>=0) jump(k); else earcon('bump'); }
  if(back){ e.preventDefault(); earcon('back'); stop(); show('shelf'); announce('Номын жагсаалт'); }
});


// Registering this is what lets a kept book play with no signal, and what
// allows the library to be added to a home screen like an app.
if(navigator.serviceWorker){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(err=>
      console.warn('Gerel: offline support unavailable', err));
  });
  // A new worker taking over means the voice list this page loaded may have
  // come from the old one's store (September's, on some phones). Ask again,
  // so new phrases speak without a second reload.
  navigator.serviceWorker.addEventListener('controllerchange',async()=>{
    try{ const r=await fetch(speechList(),{cache:'no-cache'});
      if(r.ok) SPEECH=await r.json(); }catch(e){}
  });
}

(async function(){
  try{ const r=await fetch('catalog.json',{cache:'no-store'});
    catalog=r.ok?await r.json():{shelves:[]}; }
  catch(e){ catalog={shelves:[]}; }
  if(catalog && catalog.audioBase) AUDIO_ROOT=catalog.audioBase.replace(/\/+$/,'');

  try{ const r=await fetch('blocklist.json',{cache:'no-cache'});
    if(r.ok) BLOCKED=new Set(((await r.json()).lines||[]).map(x=>x.trim()).filter(Boolean)); }
  catch(e){}

  // Which phrases have been voiced already. Without this the interface is
  // silent unless an Azure key is present, and a child hears nothing move.
  // 'no-cache' revalidates with the server. The manifest changes whenever a
  // shelf is renamed or a book added, and a cached copy leaves those names
  // silent forever with nothing to show why.
  try{ const r=await fetch(speechList(),{cache:'no-cache'});
    if(r.ok) SPEECH=await r.json(); }
  catch(e){ console.warn('speech manifest not loaded', e); }
  if(!Object.keys(SPEECH).length && !live())
    console.warn('Gerel: no speech manifest and no key — navigation will be silent.');
  applySize();
  showWho();
  // Listening until a child chooses otherwise: the library is first of all
  // for children who cannot see.
  setMode(MODES[mode] ? mode : 'listen', true);
  // Always start on the first screen, with every shelf in reach.
  openShelf=null; renderShelf();
  show('shelf');
  // With a book to go back to, Continue is focused, so Enter is back in the
  // story; otherwise the first arrow press lands on the ways of reading.
  if(showContinue()) $('contBtn').focus();
  greet();
})();
</script>
