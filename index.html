<!DOCTYPE html>
<html lang="mn">
<head>
<meta name="gerel-build" content="2026-10-02-c">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFDF7">
<title>Гэрэл хүүхдийн номын сан</title>
<meta name="description" content="Хараагүй болон харааны бэрхшээлтэй хүүхдэд зориулсан үнэгүй сонсох номын сан. Монгол хэлээр 344 ном чанга уншина. A free Mongolian audiobook library for blind and partially sighted children.">
<link rel="canonical" href="https://gerelnom.com/">
<meta property="og:title" content="Гэрэл хүүхдийн номын сан">
<meta property="og:description" content="Хараагүй хүүхдэд зориулсан үнэгүй сонсох номын сан. Монгол хэлээр.">
<meta property="og:url" content="https://gerelnom.com/">
<meta property="og:type" content="website">
<meta property="og:locale" content="mn_MN">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Гэрэл">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* Daylight, not a reading lamp at midnight. Every shelf colour is dark
       enough to carry black text at full contrast, because most children at a
       school for the blind have some sight rather than none. */
    --paper:#FFFDF7; --ink:#22243B; --muted:#6B6F8D; --line:#E8E2D4;
    --sky:#1668CC; --sun:#F5A200; --berry:#C81E38;
    --leaf:#128A54; --lilac:#6D3FB8; --coral:#DC4E1B;
    /* The bindings: the same cloth colours the covers are drawn in, so a
       shelf and the books standing on it belong to each other. */
    --cloth-1:#242C5C; --cloth-2:#7A222E; --cloth-3:#1A4236;
    --cloth-4:#5E3414; --cloth-5:#462658; --cloth-6:#804612;
    --cloth-7:#2C2C30; --gold:#D0AA5C; --gold-lit:#E9CD8C;
    /* Montserrat for every heading (1 Oct): strong and clear, and it draws
       Ө and Ү itself — tested, not assumed. Comfortaa's thin rounded letters
       were not liked. */
    --display:'Montserrat', system-ui, sans-serif;
    --navy:#242C5C;                 /* the logo's own blue */
    --body:'Nunito', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:var(--body);min-height:100%;-webkit-text-size-adjust:100%;}
  button{font-family:var(--body);cursor:pointer;border:none;background:none;color:inherit;}
  button:focus-visible,[tabindex]:focus-visible{outline:5px solid var(--ink);
    outline-offset:4px;border-radius:20px;}
  .hidden{display:none !important;}

  /* The book's own cover where the sun used to be: large when only
     listening, smaller when the words are shown too. Bright with a gold ring
     while the voice reads, a little faded when it stops, so the state shows
     across a room — which no small icon does. Nothing pulses. */
  .nowCover{height:var(--coverH,300px);aspect-ratio:2/3;border-radius:18px;
    overflow:hidden;flex:0 0 auto;background:var(--line);opacity:.6;
    filter:saturate(.75);box-shadow:0 10px 26px rgba(34,36,59,.22);
    transition:opacity .4s ease,filter .4s ease,box-shadow .4s ease;}
  .nowCover.lit{opacity:1;filter:none;
    box-shadow:0 0 0 5px var(--sun),0 14px 34px rgba(245,162,0,.42);}
  .nowCover img{width:100%;height:100%;object-fit:cover;display:block;}
  /* How far through the whole book. */
  .progress{width:min(80vw,380px);height:10px;border-radius:99px;
    background:var(--line);overflow:hidden;flex:0 0 auto;}
  .progress i{display:block;height:100%;width:0;background:var(--sun);
    border-radius:99px;transition:width .4s ease;}
  /* The book being returned to, on "continue or start again?". */
  .resumeCover{height:clamp(150px,24vh,230px);aspect-ratio:2/3;object-fit:cover;
    border-radius:14px;box-shadow:0 10px 26px rgba(34,36,59,.22);flex:0 0 auto;}

  .screen{position:fixed;inset:0;background:var(--paper);display:flex;
    flex-direction:column;overflow-y:auto;
    padding:22px 18px calc(22px + env(safe-area-inset-bottom));}
  /* The Rotary clubs and districts behind the library, at full strength so
     the sponsors can see them (rotary-bg.webp, made by gerel_rotary_bg.py; the
     tile is drawn at twice this size so it stays sharp on a phone). A pattern
     behind words is the hardest thing to read for a child who sees a little,
     so it stays off the reading and listening screens, where the story's own
     text is, and any words that sit straight on it get a paper-coloured glow
     that lifts them clear of a logo behind. Cards and buttons are solid. */
  .screen{background-image:url(rotary-bg.webp);background-size:1000px auto;}
  #player,#reader{background-image:none;}
  .screen .brand,.screen .sub,.screen .note,.screen h1{
    text-shadow:0 0 3px var(--paper),0 0 6px var(--paper),0 0 10px var(--paper),
                0 0 16px var(--paper);}
  /* Centred when there is room; when the content is taller than the screen it
     starts at the top and scrolls. Plain justify-content:center pushed the top
     beyond reach instead — the title sat 35px above a 375×812 phone, where no
     scrolling could bring it back. */
  .screen.center{align-items:center;justify-content:flex-start;text-align:center;gap:24px;}
  /* Two invisible spacers share the free space and shrink to nothing when
     there is none. (Margins on the first and last child failed: the last
     child is often an empty, hidden status line.) */
  .screen.center::before,.screen.center::after{content:'';flex:1 1 0;min-height:0;}

  /* No logo on the first screen (the user's choice, 1 Oct): the name, Continue
     and the three doors are enough. The logo stays as the tab and phone icon. */
  /* The library's name in the logo's navy, with "Гэрэл" — light — in the
     orange-red of the sun. */
  #welcome .brand{font-family:var(--display);font-weight:800;color:var(--navy);
    font-size:clamp(34px,8vw,60px);letter-spacing:-.01em;line-height:1.12;}
  #welcome .brand .gerel{color:#C2410C;}
  /* A paper backing, so a Rotary logo in the background never sits inside
     the letters — on a phone one landed right behind "Гэрэл хүүхдийн". */
  #welcome .brand{background:rgba(255,253,247,.95);border-radius:22px;
    padding:6px 18px;box-shadow:0 0 0 10px rgba(255,253,247,.6);}
  #welcome .sub{margin:0;font-size:clamp(17px,4.4vw,21px);color:var(--muted);}
  /* Continue the last book: one press from the first screen, instead of a
     door, a shelf and a search by ear. Wide and dark, above the three doors,
     so it reads as the obvious way back in. */
  .contBtn{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;
    gap:6px 16px;width:100%;max-width:1040px;min-height:clamp(84px,11vh,124px);
    padding:16px 24px;border-radius:30px;background:var(--ink);color:#fff;
    font-family:var(--display);font-weight:700;font-size:clamp(22px,2.6vw,34px);
    box-shadow:0 8px 22px rgba(34,36,59,.22);}
  .contBtn .ct{font-family:var(--body);font-weight:800;color:var(--sun);
    font-size:clamp(16px,1.9vw,24px);}
  .contBtn:focus-visible{outline:5px solid var(--sun);outline-offset:4px;}
  .doors{display:grid;gap:18px;width:100%;max-width:1040px;}
  @media(min-width:640px){.doors{grid-template-columns:1fr 1fr}
    .doors.three{grid-template-columns:1fr 1fr 1fr}}
  .door.listen{background:linear-gradient(160deg,#F0455F 0%,#C21B3C 100%);}
  .door.both  {background:linear-gradient(160deg,#2FB574 0%,#127A4B 100%);}
  .door.read  {background:linear-gradient(160deg,#4C8FF0 0%,#1F4FB8 100%);}
  .door{display:flex;flex-direction:column;align-items:center;
    gap:clamp(14px,2vw,26px);
    padding:clamp(26px,3vw,46px) clamp(12px,1.6vw,22px);
    border-radius:34px;color:#fff;
    font-family:var(--display);font-weight:700;
    /* Sized against the door's own width, not the screen's: three columns
       of 190px cannot carry 52px text, which is how the words ended up
       over the edges. */
    font-size:clamp(19px,2.1vw,34px);line-height:1.15;text-align:center;
    hyphens:none;word-break:normal;
    min-height:clamp(190px,26vh,320px);justify-content:center;
    position:relative;overflow:hidden;
    box-shadow:0 9px 0 rgba(0,0,0,.22), 0 14px 30px rgba(0,0,0,.14);
    text-shadow:0 2px 6px rgba(0,0,0,.28);}
  /* a highlight across the top, so the door reads as a raised surface */
  .door::before{content:'';position:absolute;left:0;right:0;top:0;height:38%;
    background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0));
    pointer-events:none;}
  .door small{font-family:var(--body);font-weight:600;font-size:16px;opacity:.75;}
  .door .ic{width:clamp(52px,5.4vw,96px);height:clamp(52px,5.4vw,96px);
    display:block;position:relative;z-index:1;flex:0 0 auto;}
  .door .ic svg{width:100%;height:100%;display:block;}
  /* On a phone the doors are a row each: icon beside the word, shorter, so
     the name, Continue and all three doors fit on one screen. This must come
     after the rules above — written before them, it was overridden and phones
     got three 211px doors that pushed the title off the top. */
  @media(max-width:639px){
    .door{min-height:clamp(118px,15vh,170px);
      flex-direction:row;gap:18px;justify-content:flex-start;
      padding:20px 22px;font-size:clamp(21px,6vw,30px);text-align:left;}
    .door .ic{width:54px;height:54px;}
  }
  .door:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(34,36,59,.16);}

  .bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .bar h1{font-family:var(--display);font-weight:700;
    font-size:clamp(23px,6vw,32px);margin:0;flex:1;min-width:120px;}
  .chip{padding:11px 15px;border-radius:16px;background:#fff;
    border:2px solid var(--line);font-weight:700;font-size:15px;white-space:nowrap;}
  .chip.mode{background:var(--sun);border-color:transparent;}

  /* Two columns once there is room for them: eight shelves then fill one
     screen with nothing to scroll, and a book list is half as long. Below
     560px a single column still wins — two would squeeze the titles. */
  .shelves,.books{display:grid;gap:13px;width:100%;max-width:960px;margin:0 auto;
    grid-template-columns:minmax(0,1fr);}
  @media(min-width:560px){
    .shelves,.books{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
  }
  /* minmax(0,…), not plain 1fr: a 1fr column grows to fit the longest word in
     any title, which pushed book rows 48px past a phone's edge and cut the ★
     in half. */
  /* Tall enough that four rows reach the bottom of the screen rather than
     sitting in a band across the middle. */
  @media(min-width:560px){
    .shelfCard{min-height:clamp(96px,17vh,168px);}
  }
  /* A row of letters, the way a phone's contact list works — two taps to reach
     Чиполлино instead of eighty. */
  /* Two ways into the same shelf. A child looking for a story knows its
     name; a teacher looking for Даржаа knows the author. */
  #fieldRow{display:flex;gap:10px;justify-content:center;max-width:720px;
    margin:0 auto 12px;flex-wrap:wrap;}
  #fieldRow button{min-height:54px;padding:13px 22px;border-radius:16px;
    border:3px solid var(--line);background:#fff;font-weight:800;font-size:17px;}
  #fieldRow button.on{background:var(--sky);color:#fff;border-color:transparent;}
  #letters{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
    max-width:720px;margin:0 auto 14px;}
  #letters button{min-width:44px;min-height:44px;border-radius:12px;
    border:2px solid var(--line);background:#fff;font-weight:800;font-size:16px;}
  #letters button.off{opacity:.3;}
  #letters button.on{background:var(--sun);border-color:transparent;}
  /* A shelf card as a bound volume: dark cloth, a gold rule inside the
     edge, and a spine down the left where the boards would fold. */
  .shelfCard{display:flex;align-items:center;gap:14px;text-align:left;
    padding:26px 24px;border-radius:26px;color:#fff;width:100%;
    position:relative;overflow:hidden;
    box-shadow:0 7px 0 rgba(0,0,0,.20), 0 12px 24px rgba(0,0,0,.10);}
  .shelfCard::before{content:'';position:absolute;left:0;right:0;top:0;height:40%;
    background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0));
    pointer-events:none;}
  .shelfCard .nm{flex:1;font-family:var(--display);font-weight:700;
    font-size:clamp(21px,2.2vw,27px);color:#fff;position:relative;z-index:1;
    text-shadow:0 2px 5px rgba(0,0,0,.30);}
  .shelfCard .ct{font-weight:800;font-size:14px;position:relative;z-index:1;
    color:#fff;background:rgba(0,0,0,.26);border-radius:99px;padding:6px 13px;}
  .shelfCard .sic{flex:0 0 auto;width:clamp(50px,5.2vw,76px);height:clamp(50px,5.2vw,76px);
    position:relative;z-index:1;color:#fff;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25));}
  .shelfCard .sic svg{width:100%;height:100%;display:block;}
  .bookRow.on{outline:5px solid var(--ink);outline-offset:3px;}
  /* White reads against all seven shelf colours; dark ink did not. */
  .shelfCard.on{outline:5px solid #fff;outline-offset:3px;
    box-shadow:0 7px 0 rgba(0,0,0,.20), 0 0 0 9px rgba(34,36,59,.30);}

  .bookRow{display:flex;align-items:center;gap:14px;background:#fff;
    border:3px solid var(--line);border-radius:22px;padding:11px;}
  .bookRow .cover{flex:0 0 66px;width:66px;height:94px;border-radius:14px;
    overflow:hidden;background:var(--line);display:flex;align-items:center;
    justify-content:center;font-family:var(--display);font-weight:700;
    font-size:28px;color:var(--muted);}
  .bookRow .cover img{width:100%;height:100%;object-fit:cover;display:block;}
  .bookRow .meta{flex:1;min-width:0;text-align:left;padding:4px 0;}
  .bookRow .t{display:block;font-weight:800;font-size:19px;line-height:1.3;
    overflow-wrap:anywhere;}
  .bookRow .who{display:block;font-size:14px;color:var(--muted);margin-top:4px;
    overflow-wrap:anywhere;}
  /* On a phone the title gets the whole width beside the cover, and the
     buttons drop to a line of their own under it, on the right. Side by side
     they left a title 80px wide, broken mid-word — "АЛМАА / САН" — which is
     hard to read for anyone and harder for a child who sees a little. The
     buttons stay 48px: the smallest a child's finger reliably hits. */
  @media(max-width:420px){
    .bookRow{flex-wrap:wrap;justify-content:flex-end;gap:8px 10px;padding:9px;}
    .bookRow .cover{flex-basis:52px;width:52px;height:74px;}
    .bookRow .meta{flex:1 1 calc(100% - 62px);}
  }
  .bookRow .len{display:block;font-size:13px;color:var(--muted);margin-top:3px;}
  .mark{display:inline-block;margin-left:8px;font-size:12px;font-weight:800;
    background:var(--leaf);color:#fff;border-radius:99px;padding:2px 9px;vertical-align:middle;}
  .star{flex:0 0 auto;font-size:26px;line-height:1;min-width:48px;height:48px;
    padding:0;border-radius:14px;color:#9A9482;background:#F3EEE1;
    border:2px solid var(--line);}
  .star:hover,.star:focus{background:#EAE2CE;}
  .star.is{color:#7A5B00;background:var(--sun);border-color:transparent;}
  /* Keeping a book on the phone. Beside the star and the braille link, same
     size, so the row still reads as one line to a child crossing it. */
  .keepBtn{flex:0 0 auto;font-size:21px;line-height:1;min-width:48px;height:48px;
    padding:0;border-radius:14px;font-weight:800;
    color:#fff;background:var(--leaf);border:2px solid transparent;}
  .keepBtn:hover,.keepBtn:focus{background:#0C6B40;}
  .keepBtn.is{background:#0C6B40;box-shadow:inset 0 0 0 3px var(--gold);}
  .field{border:3px solid var(--line);border-radius:18px;padding:17px 19px;
    font-family:var(--body);font-size:19px;font-weight:600;background:#fff;
    color:var(--ink);width:100%;box-sizing:border-box;}

  #player{justify-content:space-between;}
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:20px;text-align:center;padding:10px 0;}
  #nowChapter{font-weight:800;font-size:clamp(17px,2vw,22px);color:var(--ink);}
  #nowText{font-size:clamp(22px,5.6vw,38px);line-height:1.45;font-weight:800;max-width:20ch;}
  #nowText .said{color:var(--berry);}
  #nowNext{font-size:clamp(14px,3.4vw,18px);color:var(--muted);max-width:34ch;}

  .transport{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:11px;
    width:100%;max-width:560px;margin:0 auto;}
  .key{border-radius:24px;padding:22px 10px;min-height:88px;
    font-family:var(--display);font-weight:700;font-size:17px;
    background:#fff;border:3px solid var(--line);}
  .key.big{background:var(--berry);color:#fff;border-color:transparent;font-size:21px;}
  .row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));
    gap:9px;width:100%;max-width:560px;margin:11px auto 0;}
  .mini{border-radius:18px;padding:14px 8px;font-weight:700;font-size:15px;
    background:#fff;border:2px solid var(--line);min-height:56px;}
  .mini.on{background:var(--leaf);color:#fff;border-color:transparent;}

  /* Reading is a different act from browsing. Warm paper rather than white,
     a serif face, generous line spacing, and a measure of about 34 characters
     — the width the eye reads without losing its place. */
  #reader{padding:0;background:#FBF4E6;}
  #readTop{position:sticky;top:0;z-index:2;background:#FBF4E6;
    border-bottom:1px solid #E3D9C4;padding:11px 14px;display:flex;gap:9px;align-items:center;}
  #readTop .ttl{flex:1;min-width:0;font-weight:800;font-size:15px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #readTop button{border:1px solid #DCD0B6;background:#FFFDF6;border-radius:12px;
    padding:12px 14px;font-weight:700;font-size:17px;min-height:48px;color:#2A2620;}
  #readTop .ttl{color:#6B6154;}
  #readText{padding:34px 22px 140px;font-size:var(--size,32px);line-height:1.72;
    font-weight:400;max-width:34ch;margin:0 auto;color:#2A2620;
    font-family:Georgia,'Times New Roman',serif;
    text-align:left;hyphens:auto;-webkit-hyphens:auto;}
  #readText p{margin:0 0 1.05em;}
  /* The first line of a paragraph indented, as a printed book does, rather
     than a blank line between every one. */
  #readText p + p{text-indent:1.4em;margin-top:-.35em;}
  #readText .sent{border-radius:6px;padding:0 2px;cursor:pointer;}
  #readText .sent.now{background:#F3E2A9;}
  #readFoot{position:fixed;left:0;right:0;bottom:0;background:#FBF4E6;
    border-top:1px solid #E3D9C4;
    padding:11px 14px calc(11px + env(safe-area-inset-bottom));display:flex;gap:9px;}

  /* Braille download. Beside the star, same size, so the row still reads as
     one line to a child moving across it. */
  .bookRow .brl{flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    width:48px;height:48px;border-radius:14px;text-decoration:none;
    font-size:23px;font-weight:800;color:#fff;background:var(--berry);
    border:2px solid transparent;}
  .bookRow .brl:hover,.bookRow .brl:focus{background:#A3162B;}
  /* Spoken, not shown. The box sat at the foot of the welcome screen
     reading "Тавиурууд" long after the words had been said. Kept in the
     page so screen readers still receive announcements. */
  #status{position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
  /* Spoken, not shown. The box sat at the foot of the welcome screen
     reading "Тавиурууд" long after the words had been said. Kept in the
     page so screen readers still receive announcements. */
  #status{position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
  .note:empty{display:none;}
  .note{background:#fff;border:3px dashed var(--line);border-radius:20px;
    padding:17px;color:var(--muted);font-weight:600;max-width:720px;margin:14px auto;
    text-align:center;}
  .credit{font-size:13px;color:var(--muted);max-width:720px;margin:20px auto 0;
    line-height:1.6;display:block;text-align:center;}
</style>
</head>
<body>

<div id="welcome" class="screen center">
  <div class="brand"><span class="gerel">Гэрэл</span> хүүхдийн номын сан</div>

  <button class="contBtn hidden" id="contBtn"><span class="cl">▶ Үргэлжлүүлэх</span><span class="ct" id="contTitle"></span></button>

  <div class="doors three">
    <button class="door listen" id="doorListen">
      <span class="ic"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" stroke-width="5"><path d="M12 38V32a20 20 0 0 1 40 0v6"/><rect x="6" y="36" width="13" height="19" rx="6.5" fill="currentColor" stroke="none"/><rect x="45" y="36" width="13" height="19" rx="6.5" fill="currentColor" stroke="none"/></svg></span>Сонсох
    </button>
    <button class="door both" id="doorBoth">

    +'<path d="M48 18l1.5 3.5L53 23l-3.5 1.5L48 28l-1.5-3.5L43 23l3.5-1.5z" fill="currentColor"/>'),

    +'<path d="M17 24h30"/><path d="M17 33h20"/>'),

};
// Slower than normal turned out to sound dragged rather than calm, so the
// choice is normal or faster.
const SPEEDS=[1.0,1.15,1.3], SLEEPS=[0,15,30,60];

const $=id=>document.getElementById(id);

// Everything a child does is remembered on this device alone: which books they
// started, where they stopped, how big the text is. Nothing is sent anywhere
// and there is no account to make.
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const put=(k,v)=>{try{localStorage.setItem('gerel:'+k,v)}catch(e){}};
const get=(k,d)=>{try{const v=localStorage.getItem('gerel:'+k);return v===null?d:v}catch(e){return d}};

let mode=get('mode','');
let speedIndex=parseInt(get('speed','0'),10); if(isNaN(speedIndex)||!SPEEDS[speedIndex]) speedIndex=0;
let readSize=parseInt(get('size','32'),10); if(isNaN(readSize)) readSize=32;
let sleepIndex=0, favs=[];
try{ favs=JSON.parse(get('favs','[]'))||[] }catch(e){ favs=[] }
const isFav=f=>favs.includes(f);

const audioEl=new Audio(), voiceEl=new Audio();
audioEl.preload='auto';
let unlocked=false;
function unlock(){
  if(unlocked) return; unlocked=true;
  // Both elements must be started inside a real tap or a phone will refuse to
  // play anything later. Playing then pausing keeps them permitted even though
  // the silent clip ends immediately.
  const q='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=';
  [audioEl, voiceEl].forEach(el=>{
    try{
      el.src=q;
      const p=el.play();
      if(p&&p.then) p.then(()=>{ try{el.pause()}catch(e){} }).catch(()=>{});
    }catch(e){}
  });
}
const rate=()=>{const p=Math.round((SPEEDS[speedIndex]-1)*100);return (p>=0?'+':'')+p+'%'};
const xml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
const live=()=>!!AZURE_SPEECH_KEY&&!!window.SpeechSDK;
function synth(){
  const c=SpeechSDK.SpeechConfig.fromSubscription(AZURE_SPEECH_KEY,AZURE_SPEECH_REGION);
  c.speechSynthesisVoiceName=VOICE;
  c.speechSynthesisOutputFormat=SpeechSDK.SpeechSynthesisOutputFormat.Audio24Khz48KBitRateMonoMp3;
  return new SpeechSDK.SpeechSynthesizer(c,null);
}

// The interface speaks. A child who cannot see learns nothing from a silent
// app, so every move says what it is. Pre-voiced clips are preferred, which is
// what lets the published page carry no key at all.
let sayT=null, SPEECH={};
// Set the moment say() is called, not when the sound starts. Without it,
// anything waiting for the voice to finish looked during the pause before it
// began, saw silence, and started talking over the top.
let speaking=false;
// Only one thing speaks at a time. Two voices over each other is confusing to
// anyone and useless to a child who has only sound to go on.
// Counts every hush, so a run of clips from sayParts can tell it has been cut
// off and stop, instead of carrying on under whatever is said next. cutRun
// tells the run's caller it was cut: the next say() takes over the voice's
// "ended" event, so the run would otherwise never hear back.
let sayRun=0, cutRun=null;
function hush(){
  sayRun++;
  if(cutRun){ const f=cutRun; cutRun=null; f('cut'); }
  clearTimeout(sayT);
  speaking=false;
  try{ voiceEl.pause(); voiceEl.currentTime=0; }catch(e){}
}
function say(text){
  hush();
  if((text||'').trim()) speaking=true;
  sayT=setTimeout(()=>{
    const t=(text||'').trim();
    if(!t) return;
    const clip=SPEECH[t];
    if(clip){
      voiceEl.src=SPEECH_ROOT+'/'+clip;
      voiceEl.onended=()=>{ speaking=false; };
      voiceEl.play().catch(err=>{
        speaking=false;
        console.warn('Gerel: clip would not play:', clip, 'for', t, err);
        liveSay(t);
      });
      return;
    }
    console.warn('Gerel: no voice clip for:', t, '— run gerel_speak.py');
    speaking=false;
    liveSay(t);
  },220);   // a pause, so sweeping across the screen does not babble
}
function liveSay(t){
  if(!live()||!t) return;
  const s=synth();
  s.speakSsmlAsync('<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="mn-MN">'
    +'<voice name="'+VOICE+'">'+xml(t)+'</voice></speak>',
    r=>{ try{s.close()}catch(e){}
      if(r.audioData){ voiceEl.src=URL.createObjectURL(new Blob([r.audioData],{type:'audio/mpeg'}));
        voiceEl.play().catch(()=>{}); } },
    ()=>{ try{s.close()}catch(e){} });
}
function announce(t){ $('status').textContent=t; $('playerStatus').textContent=t; say(t); }

// Several clips, one after another. "Шүлэг. 37 ном." is built while the app
// runs, so it can never be recorded whole — which is why "where am I" and the
// help were silent. Each piece is recorded once ("Шүлэг", "37 ном") and they
// are played in turn. A piece with no clip is skipped rather than silencing
// the rest. Resolves 'done', 'cut' (something else spoke), 'blocked' (the
// browser allows no sound before the first touch) or 'silent' (no clips).
function sayParts(parts){
  hush();
  const run=sayRun, clips=[];
  parts.forEach(p=>{
    const t=(p||'').trim();
    if(!t) return;
    if(SPEECH[t]) clips.push(SPEECH[t]);
    else console.warn('Gerel: no voice clip for:', t, '— run gerel_speak.py');
  });
  if(!clips.length) return Promise.resolve('silent');
  speaking=true;
  return new Promise(res=>{
    const done=r=>{ if(cutRun===done) cutRun=null; res(r); };
    cutRun=done;
    const playAt=i=>{
      if(run!==sayRun) return;                // hush() has already said 'cut'
      if(i>=clips.length){ speaking=false; return done('done'); }
      voiceEl.src=SPEECH_ROOT+'/'+clips[i];
      voiceEl.onended=()=>playAt(i+1);
      voiceEl.play().catch(err=>{
        if(run!==sayRun) return;
        speaking=false;
        done(err && err.name==='NotAllowedError' ? 'blocked' : 'silent');
      });

  });
}
function announceParts(parts){
  const t=parts.filter(Boolean).join('. ');
  $('status').textContent=t; $('playerStatus').textContent=t;
  return sayParts(parts);
}

// Short sounds, for what words are too slow for. At the end of a list a press
// used to meet silence — the item was already focused, so nothing fired — and
// a child could not tell a wall from a broken key. Now there is a bump. Going
// in rises, coming back falls, success chimes, failure falls dull. Made here
// with the Web Audio API: no files to fetch, nothing to voice. Pitched above
// 200 Hz because a phone speaker cannot play a real thud. Each sound is over
// before the 220 ms pause ahead of any speech, so the two never overlap.
// Android phones also buzz for the three that matter most.
const TONES={
  bump:{wave:'triangle', notes:[[330,.05],[220,.09]], buzz:[35]},
  open:{wave:'sine',     notes:[[660,.06],[990,.09]]},
  back:{wave:'sine',     notes:[[990,.06],[660,.09]]},
  done:{wave:'sine',     notes:[[660,.06],[830,.06],[990,.09]], buzz:[30,60,30]},
  fail:{wave:'triangle', notes:[[392,.09],[262,.12]], buzz:[150]}
};
let actx=null;
function earcon(name){
  const t=TONES[name]; if(!t) return;
  try{ if(t.buzz && navigator.vibrate) navigator.vibrate(t.buzz); }catch(e){}

    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    if(!actx) actx=new AC();
    if(actx.state==='suspended') actx.resume();
    let at=actx.currentTime+0.01;
    t.notes.forEach(([hz,len])=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type=t.wave; o.frequency.value=hz;
      // A quick swell and fade, or each note starts and stops with a click.
      g.gain.setValueAtTime(0.0001,at);
      g.gain.exponentialRampToValueAtTime(0.2,at+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,at+len);
      o.connect(g); g.connect(actx.destination);
      o.start(at); o.stop(at+len+0.02);
      at+=len;
    });
  }catch(e){}
}

// Wait for the interface to stop talking before the book begins. Otherwise the
// title and the first sentence are spoken over each other, which is confusing
// for anyone and disorienting for a child who cannot see the screen.
function afterSpeaking(fn){
  let done=false;
  const go=()=>{ if(done) return; done=true; clearInterval(watch); clearTimeout(cap); fn(); };
  // A ceiling, so a clip that never reports finishing cannot strand the book.
  const cap=setTimeout(go, 12000);
  // Poll rather than listen for one event: the clip may not have started yet,
  // and 'speaking' covers the whole span from the request to the last word.
  const watch=setInterval(()=>{
    if(!speaking && voiceEl.paused) go();
  }, 120);
}

const FOREWORD=['өмнөх үг','өмнөтгөл','удиртгал','оршил','редакцаас','эмхэтгэгчээс'];

let BLOCKED=new Set();

// two minutes of names either side of a two-minute story.
const isContents=p=>{
  if(/номын\s+гарчиг\s*[:：]/i.test(p)) return true;
  const dashed=(p.match(/[^\n]{3,40}\s+[-–—]\s+[^\n]{3,60}/g)||[]).length;
  return dashed>=4 && p.length<3000;
};
const isBoilerplate=p=>{
  if(p.length>500) return false;
  const low=p.toLowerCase();
  return ALONE.some(m=>low.includes(m)) || ALONE_RE.some(r=>r.test(low));
};
// The digitisation credit. Removed from narration by agreement with the
// library: a blind child should not sit through a web address spelled out
// before every story. The library is still credited on the information screen.
const DIGITISER=['цахим хэлбэрт хөрвүүл','цахим номын сан','цогт охин тэнгэр',
  'цагаан бамбарууш','e-nom','enom','e˗nom'];
const isCredit=p=>{
  if(p.length>400) return false;
  const low=p.toLowerCase().replace(/\s+/g,'');
  return DIGITISER.some(m=>low.includes(m.replace(/\s+/g,'')));
};
function stripTail(ps){
  for(let i=0;i<ps.length;i++){
    const tail=ps.slice(i).join(' ');
    if((SEP.test(ps[i])||NOTE.test(ps[i])) && hits(tail,SELLING.concat(PUBLISHER))>=2)
      return ps.slice(0,i);
  }
  return ps;
}
function notStory(title, ps){
  const whole=ps.join(' ');
  if(hits(whole,SELLING)>=2 && whole.length<2500) return true;
  if(hits(whole,PUBLISHER)>=2 && whole.length<2500) return true;
  // A chapter actually titled "Удиртгал" or "Өмнөх үг" is a grown-up essay
  // about the book. One such introduction runs to 91,000 characters — three
  // hours of scholarship standing between a child and the first story.
  const t=(title||'').trim().toLowerCase().replace(/^["“”«»]+|["“”«».:]+$/g,'');
  if(FOREWORD.some(w=>t.startsWith(w))) return true;
  const head=(t+' '+whole.slice(0,200)).toLowerCase();
  if(FOREWORD.some(w=>head.includes(w)) && hits(whole,PUBLISHER)>=1) return true;
  return false;
}
function sents(text){
  const raw=text.match(/[^.!?…]+[.!?…]+[»”"']?|[^.!?…]+$/g)||[text];
  const out=[];let c='';
  raw.forEach(p=>{const s=(c+p).trim();if(!s)return;
    if(s.length<16){c=s+' ';return}out.push(s);c=''});
  if(c.trim())out.push(c.trim());
  return out.length?out:[text];
}
async function loadVoiced(e){
  const base=AUDIO_ROOT+'/'+e.id;
  // Revalidated, not force-cached: re-voicing a book rewrites this file, and a
  // stale copy would point at audio that no longer matches the text.
  // Tried twice: one dropped request was making a voiced book report itself
  // as unavailable, which is the most confusing thing the app can say.
  let r=null;
  for(let attempt=0; attempt<2; attempt++){
    try{
      r=await fetch(base+'/index.json',{cache:'no-cache'});
      if(r.ok) break;
      if(r.status===404) break;      // genuinely not voiced yet
    }catch(err){ r=null; }
    await new Promise(go=>setTimeout(go,700));
  }
  if(!r || !r.ok) throw new Error('unavailable');
  const d=await r.json();
  book.title=d.title||e.title; book.author=d.author||e.author||''; book.audioBase=base;
  book.lang=d.lang||'mn';
  // "whole": a recording of the entire chapter by a person (LibriVox), with
  // no sentence timing — played as one piece and moved through by time.
  book.chapters=d.chapters.map(c=>({title:c.title,
    blocks:c.blocks.map(b=>({sentences:b.sentences,audio:b.audio,marks:b.marks,
                             whole:!!b.whole,secs:b.secs||0}))}));
  $('player').lang=$('reader').lang=book.lang;
  if(!book.chapters.length) throw new Error('unavailable');
}
async function loadEpub(data,fb){
  const zip=await JSZip.loadAsync(data);
  const cont=await zip.file('META-INF/container.xml').async('string');
  const opfPath=new DOMParser().parseFromString(cont,'application/xml')
    .querySelector('rootfile').getAttribute('full-path');
  const dir=opfPath.includes('/')?opfPath.replace(/\/[^/]*$/,'/'):'';
  const opf=new DOMParser().parseFromString(await zip.file(opfPath).async('string'),'application/xml');
  book.audioBase=null;
  book.title=(opf.querySelector('metadata > *|title')||opf.querySelector('title'))?.textContent?.trim()||fb||'Ном';
  book.author=(opf.querySelector('metadata > *|creator')||opf.querySelector('creator'))?.textContent?.trim()||'';
  const href={};
  opf.querySelectorAll('manifest > item').forEach(i=>href[i.getAttribute('id')]=i.getAttribute('href'));
  const spine=[...opf.querySelectorAll('spine > itemref')]
    .map(r=>href[r.getAttribute('idref')]).filter(Boolean);
  const titles={};
  const ncx=Object.values(href).find(h=>h&&h.endsWith('.ncx'));
  if(ncx&&zip.file(dir+ncx)){
    const t=new DOMParser().parseFromString(await zip.file(dir+ncx).async('string'),'application/xml');
    t.querySelectorAll('navPoint').forEach(np=>{
      const s=np.querySelector('content')?.getAttribute('src')||'';
      const l=np.querySelector('navLabel text')?.textContent?.trim();
      const k=s.split('#')[0].split('/').pop();
      if(k&&l&&!titles[k]) titles[k]=l;
    });
  }
  book.chapters=[]; const rawKept=[];
  for(const h of spine){
    const f=zip.file(dir+h)||zip.file(h); if(!f) continue;
    const doc=new DOMParser().parseFromString(await f.async('string'),'text/html');
    doc.querySelectorAll('script,style').forEach(n=>n.remove());
    const els=[...doc.querySelectorAll('p,h1,h2,h3,h4,li,blockquote')];
    let ps=(els.length?els:[doc.body]).map(e=>(e.textContent||'').replace(/\s+/g,' ').trim())
      .map(t=>t.replace(/^\s*\[\s*[←<]\s*\d+\s*\]\s*/,'').trim())
      .filter(t=>t.length>=1 && !BLOCKED.has(t) && !isAdvert(t)
                 && !isCredit(t) && !isBoilerplate(t) && !isContents(t));
    if(!ps.length) continue;
    ps=stripTail(ps).filter(t=>t.length>1);
    if(!ps.length) continue;
    const ttl=titles[h.split('/').pop()]||doc.querySelector('h1,h2,h3')?.textContent?.trim()||ps[0].slice(0,60);
    rawKept.push({title:ttl, blocks:ps.map(p=>({sentences:sents(p)}))});
    if(notStory(ttl, ps)) continue;
    if(!book.chapters.length && ps.join(' ').length<400) continue;
    book.chapters.push({title:ttl, blocks:ps.map(p=>({sentences:sents(p)}))});
  }
  // If filtering removed everything, keep the book rather than lose it. A
  // foreword read aloud is a smaller failure than a book that will not open.
  if(!book.chapters.length && rawKept.length) book.chapters=rawKept;
  if(!book.chapters.length) throw new Error('unavailable');
}

// ---- playing ----
let ci=0,bi=0,si=0,playing=false;
// Every run of play() takes a number. Switching books raises it, so a loop
// left waiting inside an await can tell it has been superseded and stop —
// otherwise it wakes up, sees playing has been set true again by the new book,
// and carries on as a second loop driving the same speaker.
let era=0;
const clips=new Map(), ck=(c,b)=>c+':'+b;
function getClip(c,b){
  const k=ck(c,b); if(clips.has(k)) return clips.get(k);
  const blk=book.chapters[c].blocks[b];
  let p;
  if(book.audioBase&&blk.audio){
    p=Promise.resolve({url:book.audioBase+'/'+blk.audio,
      marks:(blk.marks||[]).map(m=>({s:m.s,c:m.c,l:m.l,t:m.t}))});
  } else if(live()){ p=synthLive(blk.sentences); }
  else { p=Promise.reject(new Error('unavailable')); }
  clips.set(k,p); return p;
}
function dropClips(keep=[]){
  const s=new Set(keep);
  clips.forEach((v,k)=>{ if(s.has(k))return;
    Promise.resolve(v).then(c=>{if(c&&c.url&&c.url.startsWith('blob:'))URL.revokeObjectURL(c.url)}).catch(()=>{});
    clips.delete(k); });
}
function synthLive(list){
  return new Promise((res,rej)=>{
    const s=synth();
    const head='<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="mn-MN">'
      +'<voice name="'+VOICE+'"><prosody rate="'+rate()+'">';
    let ssml=head; const spans=[];
    list.forEach((t,i)=>{ if(i) ssml+='<break time="260ms"/>';
      const safe=xml(t);
      spans.push({start:ssml.length,len:safe.length,exact:safe.length===t.length});
      ssml+=safe; });
    ssml+='</prosody></voice></speak>';
    const marks=[];
    s.wordBoundary=(x,e)=>{
      const at=e.textOffset;
      for(let i=0;i<spans.length;i++){ const sp=spans[i];
        if(at>=sp.start&&at<sp.start+sp.len){
          marks.push({s:i,c:sp.exact?at-sp.start:0,l:sp.exact?e.wordLength:0,t:e.audioOffset/1e7});
          return; } }
    };
    s.speakSsmlAsync(ssml,r=>{
      if(r.reason===SpeechSDK.ResultReason.SynthesizingAudioCompleted&&r.audioData){
        const u=URL.createObjectURL(new Blob([r.audioData],{type:'audio/mpeg'}));
        try{s.close()}catch(e){} res({url:u,marks});
      } else { try{s.close()}catch(e){} rej(new Error('unavailable')); }
    },()=>{ try{s.close()}catch(e){} rej(new Error('unavailable')); });
  });
}
function playClip(clip,from,mine){
  return new Promise((res,rej)=>{
    let frame=null;
    const done=()=>{audioEl.removeEventListener('ended',ok);audioEl.removeEventListener('error',bad);
      audioEl.removeEventListener('timeupdate',onTime);
      if(frame)cancelAnimationFrame(frame)};
    const ok=()=>{done();res()};
    // One retry before giving up: a dropped connection is far more common than
    // a genuinely missing file, and a child should not be told a book is gone
    // because a tunnel interrupted it.
    let tried=false;
    const bad=()=>{
      if(!tried && playing){
        tried=true;
        setTimeout(()=>{ try{ audioEl.load(); audioEl.play().catch(()=>{done();rej(new Error('audio'))}); }
                         catch(e){ done(); rej(new Error('audio')); } }, 1200);
        return;
      }
      done(); rej(new Error('audio'));
    };
    // A whole-chapter recording has no marks to follow. Its place, the saved
    // position and the progress bar are kept from the audio's own time
    // updates instead — these go on with the screen off, which is how a blind
    // child listens; a screen-refresh timer stops then, and nothing was saved.
    let lastWhole=-9;
    const onTime=()=>{
      if(!playing || (mine!==undefined && mine!==era) || clip.marks.length || !isWhole()) return;
      const t=audioEl.currentTime;
      if(Math.abs(t-lastWhole)>=2){ lastWhole=t; resumeT=t; paint(); }
    };
    audioEl.addEventListener('timeupdate',onTime);
    const tick=()=>{
      // Settle the promise rather than abandoning it. Leaving it unresolved
      // is what let an old loop sit waiting and then wake up later.
      if(!playing || (mine!==undefined && mine!==era)){ done(); res(); return; }
      const t=audioEl.currentTime; let cur=null;
      for(const m of clip.marks){ if(m.t<=t) cur=m; else break; }
      if(cur){ si=cur.s; paint(cur.c+cur.l); }
      frame=requestAnimationFrame(tick);
    };
    audioEl.addEventListener('ended',ok); audioEl.addEventListener('error',bad);
    // A book on a slow connection was being reported as unavailable. Say it is
    // loading instead, and give it time.
    const slow=setTimeout(()=>{ if(playing) announce('Ачаалж байна…'); }, 1500);
    audioEl.addEventListener('playing',()=>clearTimeout(slow),{once:true});
    audioEl.addEventListener('canplay',()=>clearTimeout(slow),{once:true});
    audioEl.src=clip.url;
    audioEl.playbackRate=book.audioBase?SPEEDS[speedIndex]:1;
    if(from>0) audioEl.addEventListener('loadedmetadata',()=>{try{audioEl.currentTime=from}catch(e){}},{once:true});
    audioEl.play().then(()=>{frame=requestAnimationFrame(tick)}).catch(e=>{done();rej(e)});
  });
}

const chap=()=>book.chapters[ci], blk=()=>chap().blocks[bi];
const sent=()=>blk().sentences[si]||'';
const nextOf=(c,b)=>b+1<book.chapters[c].blocks.length?{c,b:b+1}
  :(c+1<book.chapters.length?{c:c+1,b:0}:null);
const posKey=()=>'pos:'+book.title;
// In a whole-chapter recording the place is a time, not a sentence. It is
// kept here and saved with the position, so a child comes back to the minute
// they stopped at, not the start of a thirty-minute chapter.
let resumeT=0;
const isWhole=()=>!!(book.chapters.length && chap() && blk() && blk().whole);
const wholeT=()=>isWhole()?(playing&&audioEl.src?audioEl.currentTime:resumeT):0;
const savePos=()=>put(posKey(),JSON.stringify({ci,bi,si,t:Math.round(wholeT())}));
function loadPos(){
  resumeT=0;
  try{ const s=JSON.parse(get(posKey(),'null'));
    if(s&&book.chapters[s.ci]){ ci=s.ci;
      bi=Math.min(s.bi||0,book.chapters[ci].blocks.length-1);
      si=Math.min(s.si||0,book.chapters[ci].blocks[bi].sentences.length-1);
      if(book.chapters[ci].blocks[bi].whole) resumeT=s.t||0;
      return true; } }catch(e){}
  return false;
}
// Moving by time inside a whole-chapter recording: the arrows ten seconds, the
// headset thirty. Past either end, into the next or previous part.
function seekWhole(sec){
  const dur=(isFinite(audioEl.duration)&&audioEl.duration)||blk().secs||0;
  const cur=playing?audioEl.currentTime:resumeT, to=cur+sec;
  if(to>=0 && (!dur || to<dur-1)){
    if(playing) audioEl.currentTime=to; else { resumeT=to; paint(); }
    return;
  }
  const prev=bi>0?{c:ci,b:bi-1}:(ci>0?{c:ci-1,b:book.chapters[ci-1].blocks.length-1}:null);
  const nx= to<0 ? (cur>2?{c:ci,b:bi}:prev) : nextOf(ci,bi);
  if(!nx){ earcon('bump'); return; }
  const newCh=nx.c!==ci, was=playing; stop();
  ci=nx.c; bi=nx.b; si=0; resumeT=0; paint();
  if(newCh) media();
  if(was) play();
}
// How far through the whole book, by characters: the nearest thing to time
// without timing every paragraph. Counted once per book.
const progressOf=new WeakMap();
function progressPct(){
  let p=progressOf.get(book.chapters);
  if(!p){
    p={start:[],total:0};
    // Whole-chapter recordings are measured in seconds instead.
    book.chapters.forEach((ch,c)=>{ p.start[c]=[];
      ch.blocks.forEach((bl,b)=>{ p.start[c][b]=p.total;
        p.total+=bl.whole?(bl.secs||0):bl.sentences.join('').length; }); });
    progressOf.set(book.chapters,p);
  }
  if(!p.total) return 0;
  const bl=book.chapters[ci].blocks[bi];
  let at=p.start[ci][bi];
  if(bl.whole) at+=wholeT();
  else for(let k=0;k<si;k++) at+=(bl.sentences[k]||'').length;
  return Math.min(100,Math.round(at/p.total*100));
}
function paint(upto){
  if(!book.chapters.length) return;
  const t=sent(), c=chap();
  const pct=progressPct();
  $('nowChapter').textContent=(ci+1)+'-р бүлэг · '+pct+'%';
  $('nowProgress').style.width=pct+'%';
  $('nowText').innerHTML = (upto>0&&upto<t.length)
    ? '<span class="said">'+esc(t.slice(0,upto))+'</span>'+esc(t.slice(upto))
    : esc(t);
  const nb=c.blocks[bi+1];
  $('nowNext').textContent=blk().sentences[si+1]||(nb&&nb.sentences[0])||'';
  markRead(); savePos();
}
async function play(){
  // Reading mode has no voice at all: a child who chose to read should never
  // have a book start talking, and nothing here should reach for audio.
  if(mode==='read') return;

  // Wait here, not at the six places that call this. Guarding the call sites
  // meant the play button and the chapter list slipped through, and the title
  // was still being spoken when the story began.
  if(speaking || !voiceEl.paused){
    afterSpeaking(play);
    return;
  }

  unlock();
  const mine=++era;
  playing=true;
  $('lamp').classList.add('lit');
  $('playBtn').textContent='❚❚ Зогсоох'; $('readPlayBtn').textContent='❚❚ Зогсоох';
  media();
  let misses=0, firstMiss=null;
  while(playing&&mine===era&&ci<book.chapters.length){
    paint(0);
    const nx=nextOf(ci,bi);
    // A separator — "* * *", a row of dots — has nothing to say, and no
    // recording was ever made for one. Reaching it used to stop the book with
    // "not ready": 692 of them in 81 books (ГЭСЭР stopped after paragraph 41).
    if(speakable(ci,bi)){
      let clip;
      try{ clip=await getClip(ci,bi); }
      catch(e){ if(playing&&mine===era) notReady(); return; }
      if(!playing||mine!==era) return;
      if(nx) getClip(nx.c,nx.b).catch(()=>{});
      const m=clip.marks.find(x=>x.s===si);
      const from=blk().whole?resumeT:(m?m.t:0);
      try{ await playClip(clip,from,mine); misses=0; firstMiss=null; }
      catch(e){
        if(!playing||mine!==era) return;
        // One paragraph that will not play is skipped, so a single missing
        // recording cannot end the story. Three in a row is a book, or a
        // connection, that really is not there: go back to the first one, so
        // nothing is lost when the signal returns.
        if(!firstMiss) firstMiss={c:ci,b:bi};
        if(++misses>=3){ ci=firstMiss.c; bi=firstMiss.b; si=0; notReady(); return; }
        console.warn('Gerel: skipped a paragraph that would not play:', ci, bi);
      }
      if(!playing||mine!==era) return;
    }
    if(!nx){
      stop(); earcon('done');
      const next=nextPart(book.entry);
      if(next) continueSeries(next); else announce('Ном дууслаа.');
      return;
    }
    const newCh=nx.c!==ci; ci=nx.c; bi=nx.b; si=0; resumeT=0;
    if(newCh){ announce(chap().title); media(); }
    const a=nextOf(ci,bi);
    dropClips([ck(ci,bi)].concat(a?[ck(a.c,a.b)]:[]));
  }
}
// Whether a paragraph has anything to say: a letter or a digit anywhere in it.
const speakable=(c,b)=>/[\p{L}\p{N}]/u.test(book.chapters[c].blocks[b].sentences.join(''));
function stop(){
  // Keep the place in a whole-chapter recording before the audio is cleared.
  if(playing && isWhole() && audioEl.currentTime>0) resumeT=audioEl.currentTime;
  playing=false; era++;
  try{ audioEl.pause(); audioEl.removeAttribute('src'); audioEl.load(); }catch(e){}
  $('lamp').classList.remove('lit');
  $('playBtn').textContent='▶ Сонсох'; $('readPlayBtn').textContent='▶ Сонсох';
  paint();
}
function notReady(){
  stop();
  earcon('fail');
  $('playerStatus').classList.remove('hidden');
  // A book whose text loaded but whose audio has not been made yet can still
  // be read. Saying "not ready" would hide a book that is half available.
  if(book.chapters.length && !book.audioBase){
    announce('Энэ номыг одоогоор чанга уншиж чадахгүй. "Том үсгээр" дарж уншина уу.');
  } else {
    announce('Энэ ном хараахан бэлэн болоогүй байна.');
  }
}
function step(d){
  if(!book.chapters.length) return;
  // In a whole-chapter recording the arrows move ten seconds while it plays;
  // stopped, they move between parts.
  if(isWhole() && playing){ seekWhole(d*10); return; }
  let c=ci,b=bi,s=si+d;
  while(s<0){
    if(b>0){b--;s+=book.chapters[c].blocks[b].sentences.length}
    else if(c>0){c--;b=book.chapters[c].blocks.length-1;s+=book.chapters[c].blocks[b].sentences.length}
    else {s=0;break}
  }
  while(s>=book.chapters[c].blocks[b].sentences.length){
    const n=book.chapters[c].blocks[b].sentences.length;
    if(b+1<book.chapters[c].blocks.length){s-=n;b++}
    else if(c+1<book.chapters.length){s-=n;c++;b=0}
    else {s=n-1;break}
  }
  // First or last sentence of the book: nowhere to go. Say so with the bump
  // and leave the voice alone, rather than restarting the sentence.
  if(c===ci && b===bi && s===si){ earcon('bump'); return; }
  const was=playing; stop();
  ci=c;bi=b;si=s; resumeT=0; paint(); if(was) play();
}
function jump(i){
  stop(); ci=i;bi=0;si=0; resumeT=0; paint();
  show(mode==='read'?'reader':'player'); buildRead();
  announce(chap().title); play();
}

// Lock screen, headphone button, car stereo. A child listening in bed with the
// screen off is the ordinary case here, not the exception.
function media(){
  if(!('mediaSession' in navigator)||!book.chapters.length) return;
  const art=book.entry&&book.entry.cover?[{src:book.entry.cover,sizes:'320x480',type:'image/jpeg'}]:[];
  navigator.mediaSession.metadata=new MediaMetadata({
    title:chap().title, artist:book.author||'Гэрэл', album:book.title, artwork:art});
  const set=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(e){}};
  set('play',()=>play()); set('pause',()=>stop()); set('stop',()=>stop());
  // A double-press on a headset is "next", a triple-press "previous". One
  // sentence — what the arrow keys move — is too small a step for that; a
  // child in bed wants "back a bit" or "on a bit", as in any audiobook app.
  // The lock screen's own seek buttons say how far they mean; 10 s otherwise.
  set('previoustrack',()=>skip(-30)); set('nexttrack',()=>skip(30));
  set('seekbackward',d=>skip(-((d&&d.seekOffset)||10)));
  set('seekforward', d=>skip( (d&&d.seekOffset)||10));
}

// Moving by time rather than by sentence. The book's text is all there is to
// go on, so time is worked out from its length: the recorded books run at
// about 13 characters a second (Батаа 13.4, Есүй 12.5, measured from their
// timing marks), faster at a higher speed. Always lands at the start of a
// sentence, never mid-word.
const CHARS_PER_SEC=13;
function skip(seconds){
  if(!book.chapters.length) return;
  if(isWhole()){ seekWhole(seconds); return; }    // real time, not estimated
  const d=seconds<0?-1:1;
  const blocks=c=>book.chapters[c].blocks;
  const sents=(c,b)=>blocks(c)[b].sentences;
  let want=Math.abs(seconds)*CHARS_PER_SEC*(SPEEDS[speedIndex]||1);
  let c=ci,b=bi,s=si,moved=false;
  while(want>0){
    let nc=c,nb=b,ns=s+d;
    if(ns<0){
      if(nb>0) nb--;
      else if(nc>0){ nc--; nb=blocks(nc).length-1; }
      else break;
      ns=sents(nc,nb).length-1;
    } else if(ns>=sents(nc,nb).length){
      if(nb+1<blocks(nc).length) nb++;
      else if(nc+1<book.chapters.length){ nc++; nb=0; }
      else break;
      ns=0;
    }
    if(ns<0) break;                           // an empty paragraph: stop here
    // Forward, the sentence being left is what has been skipped; backward,
    // the one being entered.
    const len=((d>0 ? sents(c,b)[s] : sents(nc,nb)[ns])||'').length || 1;
    // Stop at whichever sentence start is nearer the target, so one long
    // sentence does not carry a 30 s skip to 40. The first step is always
    // taken: a press must move.
    if(moved && want<len/2) break;
    want-=len;
    c=nc; b=nb; s=ns; moved=true;
  }
  if(!moved){ earcon('bump'); return; }     // the very start or end of the book
  const newCh=c!==ci, was=playing; stop();
  ci=c; bi=b; si=s; paint();
  if(newCh) media();
  if(was) play();
}

// ============================================================
// Keeping a book on this device
// ============================================================
// Mobile data costs money and dormitory wifi comes and goes, so a book a child
// has started should stay on the phone. Each file goes into the browser's own
// cache; nothing is fetched twice and no app store is involved.
const KEPT='gerel-books-v1';

async function isKept(entry){
  if(!window.caches || !entry.id) return false;
  try{
    const c=await caches.open(KEPT);
    return !!(await c.match(AUDIO_ROOT+'/'+entry.id+'/index.json'));
  }catch(e){ return false; }
}

async function keepBook(entry, onProgress){
  if(!window.caches) throw new Error('offline storage unavailable');
  // Ask the browser not to clear kept books when the phone runs short of
  // space. Without it a cheap phone can quietly drop a book the child thinks
  // is there.
  if(navigator.storage && navigator.storage.persist)
    navigator.storage.persist().catch(()=>{});
  const c=await caches.open(KEPT);
  const base=AUDIO_ROOT+'/'+entry.id;
  const r=await fetch(base+'/index.json',{cache:'no-cache'});
  if(!r.ok) throw new Error('unavailable');
  // Copy BEFORE reading the body. Cloning afterwards throws, which is what
  // made every download fail silently.
  const copy=r.clone();
  const data=await r.json();

  const files=[];
  data.chapters.forEach(ch=>ch.blocks.forEach(b=>{ if(b.audio) files.push(base+'/'+b.audio); }));
  if(entry.cover) files.push(entry.cover);

  let done=0, missing=0;
  // Four at a time: a hundred at once stalls a slow connection and leaves the
  // child with no sign that anything is happening.
  for(let i=0;i<files.length;i+=4){
    await Promise.all(files.slice(i,i+4).map(async u=>{
      try{ if(!(await c.match(u))) await c.add(u); }
      // The cover is only a picture; a chapter that did not arrive is a hole
      // the child finds with no signal, when it can no longer be fixed.
      catch(e){ if(u!==entry.cover) missing++; }
      done++;
      if(onProgress) onProgress(done, files.length);
    }));
  }
  if(missing) throw new Error(missing+' of '+files.length+' files did not arrive');
  // index.json goes in last because it is what marks the book as kept. A
  // dropped connection leaves the chapters already fetched in place, so
  // pressing again carries on from where it stopped.
  await c.put(base+'/index.json', copy);
  return files.length;
}

async function forgetBook(entry){
  if(!window.caches) return;
  const c=await caches.open(KEPT);
  const keys=await c.keys();
  const base=AUDIO_ROOT+'/'+entry.id+'/';
  await Promise.all(keys.filter(k=>k.url.includes(base)).map(k=>c.delete(k)));
}

// ============================================================
// Signing in
// ============================================================
// Accounts exist so a child can keep books on their own phone. Nothing about
// them is sent anywhere: the list of usernames and password hashes is fetched
// like any other file and checked here in the browser. No reading history is
// recorded, and using the library creates no account.
let me=null;
try{ me=JSON.parse(get('me','null')); }catch(e){ me=null; }

async function hashPassword(user,password){
  const data=new TextEncoder().encode('gerel:'+user.toLowerCase()+':'+password);
  const buf=await crypto.subtle.digest('SHA-256',data);
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

function showWho(){
  $('loginChip').textContent = me ? (me.name||me.user) : 'Нэвтрэх';

async function signIn(){
  const user=($('loginUser').value||'').trim().toLowerCase();
  const pass=$('loginPass').value||'';
  if(!user||!pass){ $('loginNote').textContent='Нэр болон нууц үгээ бөглөнө үү.'; return; }

  $('loginGo').disabled=true;
  $('loginNote').textContent='Шалгаж байна…';
  try{
    const r=await fetch('users.json',{cache:'no-cache'});
    if(!r.ok) throw new Error('жагсаалт алга');
    const list=(await r.json()).users||[];
    const found=list.find(p=>(p.user||'').toLowerCase()===user);
    const hash=await hashPassword(user,pass);
    if(!found || found.hash!==hash){
      $('loginNote').textContent='Нэр эсвэл нууц үг буруу байна.';
      earcon('fail'); say('Нэр эсвэл нууц үг буруу байна.');
      return;
    }
    me={user:found.user,name:found.name||found.user,role:found.role||'сурагч'};
    put('me',JSON.stringify(me));
    showWho();
    $('loginPass').value='';
    $('loginNote').textContent='';
    renderShelf();
    show('shelf');
    earcon('done'); announce('Сайн байна уу, '+(me.name||me.user));
  }catch(err){
    $('loginNote').textContent='Нэвтэрч чадсангүй. Дараа дахин оролдоно уу.';
  }finally{
    $('loginGo').disabled=false;
  }
}

function signOut(){
  me=null;
  try{ localStorage.removeItem('gerel:me'); }catch(e){}
  showWho();
  announce('Гарлаа.');
}

// Only shelves meant for children. A shelf marked forChildren:false — such as
// "Хасагдсан", where books taken off on 2 Oct wait — must not leak its books
// into "random", "Богино ном", favourites or Continue.
const allBooks=()=>{
  const m=new Map();
  (catalog?.shelves||[]).filter(g=>g.forChildren!==false).forEach(g=>(g.books||[]).forEach(b=>{
    if(b&&b.title&&b.file&&!m.has(b.file)) m.set(b.file,b); }));
  return [...m.values()];
};
const everyBook=()=>allBooks().filter(reachable);

// ============================================================
// Books in parts
// ============================================================
// "ШААЛУУ ХҮҮ МАУГЛИ - 2", "МОНТЕ-КРИСТО ГҮН 4", "НУУЦАТ АРАЛ - 1 : АЮУЛД
// УЧРАГСАД", "ИРГЭНИЙ БОЛОВСРОЛ X": the part is in the title. Read here rather
// than stored, so a book added later joins its series on its own. Checked
// against all 344 titles: 34 series, no false matches.
const ROMAN={I:1,II:2,III:3,IV:4,V:5,VI:6,VII:7,VIII:8,IX:9,X:10,XI:11,XII:12};
function partOf(title){
  const m=String(title||'').toUpperCase().trim()
    .match(/^(.+?)\s*(?:[-–—]\s*|\s)(\d{1,2}|[IVX]{1,4})\s*(?:[:(].*)?$/);
  if(!m) return null;
  const n=/^\d+$/.test(m[2])?+m[2]:ROMAN[m[2]];
  if(!n) return null;
  // Latin letters that look Cyrillic ("ЭX") are folded, so a spelling slip
  // does not split a series in two.
  const key=m[1].replace(/[ABCEHKMOPTXY]/g,c=>'АВСЕНКМОРТХУ'['ABCEHKMOPTXY'.indexOf(c)])
                .replace(/[^\p{L}\p{N}]/gu,'');
  return key?{key,n}:null;
}
let SERIES=null;                         // series key -> Map(part -> book)
function series(){
  if(SERIES) return SERIES;
  if(!catalog) return new Map();
  SERIES=new Map();
  allBooks().forEach(b=>{
    const p=partOf(b.title); if(!p) return;
    if(!SERIES.has(p.key)) SERIES.set(p.key,new Map());
    SERIES.get(p.key).set(p.n,b);
  });
  return SERIES;
}
// A part is shown only when every part before it is in the library. A lone
// "МОНТЕ-КРИСТО ГҮН 4" drops a child into the middle of a story with no way
// back to its beginning. It comes back by itself once the earlier parts are
// added — 14 books are waiting on this.
function reachable(b){
  const p=partOf(b&&b.title); if(!p) return true;
  const parts=series().get(p.key);
  if(!parts) return true;
  for(let i=1;i<p.n;i++) if(!parts.has(i)) return false;
  return true;
}
function nextPart(b){
  const p=partOf(b&&b.title); if(!p) return null;
  const parts=series().get(p.key);
  return (parts&&parts.get(p.n+1))||null;
}
// The end of one part opens the next, as one book would: a child should not
// have to find volume 2 on a shelf by ear to hear how the story goes on.
async function continueSeries(next){
  const r=await announceParts(['Ном дууслаа.','Дараагийн боть']);
  if(r==='cut') return;                  // the child has done something else
  await openBook(next,{play:true});
}

function shelvesOf(){
  const base=(catalog?.shelves||[]).filter(g=>g.forChildren!==false)
    .map(g=>Object.assign({},g,{books:(g.books||[]).filter(reachable)}))
    .filter(g=>g.books.some(b=>b&&b.title&&b.file));
  const f=everyBook().filter(b=>isFav(b.file));
  // Short books, for bedtime or one lesson: everything a quarter of an hour
  // or less, gathered from every shelf. English books stay on their own
  // shelf: a child who has no English should not meet one by chance.
  const short=everyBook().filter(b=>b.lang!=='en'&&b.minutes>0&&b.minutes<=15)
    .sort((a,b)=>(a.title||'').localeCompare(b.title||'','mn'));
  const all=f.length?[{name:'Миний ном',books:f}].concat(base):base;
  return short.length?all.concat([{name:'Богино ном',books:short}]):all;
}
const mins=m=>m<60?m+' минут':(m%60?Math.floor(m/60)+' цаг '+(m%60)+' минут':Math.floor(m/60)+' цаг');
const begun=t=>!!get('pos:'+t,'');

// Eighty-six titles in one scroll is unusable by eye and worse by ear, so the
// list can be ordered three ways and jumped into by letter.
const SORTS=[
  ['А–Я', (a,b)=> letterField==='author'
      ? (authorName(a.author)||a.title||'').localeCompare(
          authorName(b.author)||b.title||'','mn')
      : (a.title||'').localeCompare(b.title||'','mn')],
  ['Богино эхэлж', (a,b)=>(a.minutes||0)-(b.minutes||0)],
  ['Урт эхэлж',    (a,b)=>(b.minutes||0)-(a.minutes||0)],
];
let sortIndex=parseInt(get('sort','0'),10); if(isNaN(sortIndex)||!SORTS[sortIndex]) sortIndex=0;
let letterPick='';
// Which field the alphabet works on. Remembered, because a teacher who
// searches by author will do it again tomorrow.
let letterField=get('lfield','title');

const MN_LETTERS='АБВГДЕЁЖЗИЙКЛМНОӨПРСТУҮФХЦЧШЩЭЮЯ'.split('');
const firstLetter=t=>((t||'').trim().charAt(0)||'').toUpperCase();
// Mongolian names carry the father's initial in front — Л. Чойжилсүрэн —
// so the first character is not the name at all. Filing him under Л would
// put half the library under four letters. Any run of single letters
// followed by a full stop is dropped, which leaves ААЗ and ЮНЕСКО alone
// because neither has one.
const AUTHOR_INITIALS=/^(\s*[А-ЯЁӨҮA-Z]\s*[.．]\s*)+/;
const authorName=x=>String(x||'').replace(AUTHOR_INITIALS,'').trim();
// A book with no author still has to appear somewhere, so it falls back to
// its title rather than vanishing from the author alphabet.
const keyOf=b=>firstLetter(letterField==='author'
  ? (authorName(b.author) || b.title) : b.title);

let letterCounts={};
const countFor=L=>letterCounts[L]||0;

function renderLetters(books){
  letterCounts={};
  books.forEach(b=>{ const L=keyOf(b); letterCounts[L]=(letterCounts[L]||0)+1; });
  const box=$('letters');
  box.innerHTML='';
  if(!books.length) return;
  const present=new Set(books.map(b=>keyOf(b)));
  MN_LETTERS.filter(L=>present.has(L)).forEach(L=>{
    const b=document.createElement('button');
    b.textContent=L;
    if(L===letterPick) b.className='on';
    // Spoken on hover and on focus, so a child sweeping across with arrows
    // hears each letter rather than having to see it.
    const speak=()=>{ if(present.has(L)) say(L); };
    b.addEventListener('mouseenter',onHover(speak));
    b.addEventListener('mouseleave',()=>clearTimeout(hoverT));
    b.addEventListener('focus',speak);
    b.addEventListener('click',()=>{
      if(!present.has(L)){ say(L+'. Ном алга.'); return; }
      letterPick = (letterPick===L) ? '' : L;
      renderShelf();
      announce(letterPick || 'Бүх ном');
      // Land on the books, so the next arrow press moves through them.
      setTimeout(()=>{ const bands=shelfBands();
        const bl=bands.indexOf($('bookList'));
        if(bl>=0 && letterPick) enterBand(bands,bl,0); }, 60);
    });
    box.appendChild(b);
  });
}

const FIELDS=[['title','Номын нэр'],['author','Зохиогчийн нэр']];
function renderFields(){
  const box=$('fieldRow');
  box.innerHTML='';
  FIELDS.forEach(([k,label])=>{
    const b=document.createElement('button');
    b.textContent=label;
    if(letterField===k) b.className='on';
    b.addEventListener('focus',()=>say(label));
    b.addEventListener('mouseenter',onHover(()=>say(label)));
    b.addEventListener('mouseleave',()=>clearTimeout(hoverT));
    b.addEventListener('click',()=>{
      letterField=k; put('lfield',k);
      letterPick='';                 // the old letter means nothing now
      renderShelf();
      announce(label);
    });
    box.appendChild(b);
  });
}

function renderShelf(){
  const L=$('shelfList'), B=$('bookList');
  L.innerHTML=''; B.innerHTML=''; rows=[]; pick=-1;
  $('shelfNote').classList.add('hidden');

  if(openShelf===null){
    $('letters').innerHTML='';
    $('fieldRow').innerHTML='';
    letterPick='';
    $('shelfTitle').textContent='Тавиурууд';
    $('backChip').textContent='← Эхэлье';
    const list=shelvesOf();
    list.forEach((g,i)=>{
      const n=(g.books||[]).filter(b=>b&&b.title&&b.file).length;
      const c=document.createElement('button');
      c.className='shelfCard';
      const st=SHELF_STYLE[g.name];
      c.style.background=st?st[0]:COLOURS[i%COLOURS.length];
      c.innerHTML='<span class="sic">'+SHELF_ICONS[st?st[1]:'book']+'</span>'
        +'<span class="nm">'+esc(g.name)+'</span><span class="ct">'+n+' ном</span>';
      const speak=(noScroll)=>{ pick=i; hi(L,i,true,noScroll); say(g.name); };
      c.addEventListener('mouseenter',onHover(()=>speak(true)));
      c.addEventListener('mouseleave',()=>clearTimeout(hoverT));
      c.addEventListener('focus',()=>speak(false));
      c.addEventListener('click',()=>{ unlock(); earcon('open'); openShelf=i; renderShelf(); announce(g.name); });
      L.appendChild(c);
    });
    if(!list.length){
      $('shelfNote').classList.remove('hidden');
      $('shelfNote').textContent='Ном алга байна. Доороос өөрийн ном нээж болно.';
    }
    return;
  }

  const g=shelvesOf()[openShelf];
  if(!g){ openShelf=null; renderShelf(); return; }
  $('shelfTitle').textContent=g.name;
  $('backChip').textContent='← Тавиурууд';
  let all=(g.books||[]).filter(b=>b&&b.title&&b.file);
  renderFields();
  renderLetters(all);
  if(letterPick) all=all.filter(b=>keyOf(b)===letterPick);
  all=all.slice().sort(SORTS[sortIndex][1]);
  all.forEach((e,i)=>{
    rows.push(e);
    const r=document.createElement('div');
    r.className='bookRow'; r.dataset.i=i;
    const cov=e.cover
      ?'<span class="cover"><img src="'+esc(e.cover)+'" alt="" loading="lazy"></span>'
      :'<span class="cover">'+esc((e.title||'?').trim().charAt(0))+'</span>';
    r.innerHTML=cov
      +'<button class="meta"><span class="t">'+esc(e.title)
      +(begun(e.title)?'<span class="mark">эхэлсэн</span>':'')+'</span>'
      +(e.author?'<span class="who">'+esc(e.author)+'</span>':'')
      +(e.minutes?'<span class="len">'+mins(e.minutes)+'</span>':'')+'</button>'
      +(e.braille?'<a class="brl" href="'+esc(e.braille)+'" download '
        +'aria-label="Брайль татах'+(e.braillePages?', '+e.braillePages+' хуудас':'')
        +'">⠃</a>':'')
      +'<button class="keepBtn'+(me?'':' hidden')+'" aria-label="Татах">⤓</button>'
      +'<button class="star'+(isFav(e.file)?' is':'')+'" aria-label="Дуртай">★</button>';
    // Title and author together: a child cannot tell three books called
    // "Үлгэрүүд" apart, and the author is how a library distinguishes them.
    const speak=(noScroll)=>{ pick=i; hi(B,i,true,noScroll);
      say(e.author ? e.title + '. ' + e.author : e.title); };
    const meta=r.querySelector('.meta');
    meta.addEventListener('click',()=>{ unlock(); openBook(e); });
    meta.addEventListener('mouseenter',onHover(()=>speak(true)));
    meta.addEventListener('mouseleave',()=>clearTimeout(hoverT));
    meta.addEventListener('focus',()=>speak(false));
    const brl=r.querySelector('.brl');
    if(brl){
      // Downloading is silent, which on a page that talks reads as a failure.
      brl.addEventListener('focus',()=>say('Брайль татах'));
      brl.addEventListener('mouseenter',onHover(()=>say('Брайль татах')));
      brl.addEventListener('click',ev=>{ ev.stopPropagation();
        announce('Брайль файл татагдаж байна.'); });
    }
    const keep=r.querySelector('.keepBtn');
    if(keep){
      isKept(e).then(yes=>{ if(yes) keep.classList.add('is'); });
      keep.addEventListener('focus',()=>say('Татах'));
      keep.addEventListener('mouseenter',onHover(()=>say('Татах')));
      keep.addEventListener('click',async ev=>{
        ev.stopPropagation();
        if(!me){ show('login'); $('loginUser').focus(); return; }
        if(keep.classList.contains('is')){
          await forgetBook(e); keep.classList.remove('is');
          earcon('back'); announce('Утаснаас устгалаа.'); return;
        }
        keep.disabled=true;
        announce('Татаж байна…');
        try{
          await keepBook(e,(done,all)=>{ keep.textContent=Math.round(done/all*100)+'%'; });
          keep.textContent='⤓'; keep.classList.add('is');
          earcon('done'); announce('Утсанд хадгаллаа. Интернэтгүй сонсож болно.');
        }catch(err){
          keep.textContent='⤓';
          console.warn('Gerel: download failed for', e.id, err);
          earcon('fail'); announce('Татаж чадсангүй.');
        }finally{ keep.disabled=false; }
      });
    }
    r.querySelector('.star').addEventListener('click',ev=>{
      ev.stopPropagation();
      favs=isFav(e.file)?favs.filter(x=>x!==e.file):favs.concat([e.file]);
      put('favs',JSON.stringify(favs));
      ev.currentTarget.classList.toggle('is');
      earcon(isFav(e.file)?'done':'back');
      announce(isFav(e.file)?'Дуртай номонд нэмлээ.':'Дуртай номноос хаслаа.');
    });
    B.appendChild(r);
  });
}
// The shelf screen is three bands stacked: the two field buttons, the
// alphabet, the books. On the shelves screen it is one. Empty bands are
// left out, so the arrows never land somewhere with nothing in it.
function shelfBands(){
  const list = openShelf===null
    ? [$('shelfList')]
    : [$('fieldRow'), $('letters'), $('bookList')];
  return list.filter(b=>b && b.children.length);
}
// How many columns the CSS is actually using, so up and down move by a row
// whatever the screen width turns out to be.
function colsOf(box){
  try{
    const t=getComputedStyle(box).gridTemplateColumns;
    if(t && t!=='none') return t.split(' ').filter(Boolean).length || 1;
  }catch(e){}
  // The letters and the field buttons are a wrapping flex row, so measure
  // where the second line starts instead.
  const kids=[...box.children];
  if(kids.length<2) return kids.length||1;
  const top=kids[0].offsetTop;
  let n=0; for(const k of kids){ if(k.offsetTop!==top) break; n++; }
  return n||1;
}
function bandOf(bands){
  const el=document.activeElement;
  for(let i=0;i<bands.length;i++){
    if(el && el!==document.body && bands[i].contains(el)) return i;
    if(bands[i].querySelector('.bookRow.on,.shelfCard.on')
       && (!el || el===document.body)) return i;
  }
  return bands.findIndex(b=>b.querySelector('.bookRow.on,.shelfCard.on'));
}
function posIn(band,items){
  const el=document.activeElement;
  if(el && band.contains(el)){
    const i=items.indexOf(el.closest('#fieldRow>*,#letters>*,.bookRow,.shelfCard'));
    if(i>=0) return i;
  }
  return items.findIndex(x=>x.classList.contains('on') &&
    (x.classList.contains('bookRow')||x.classList.contains('shelfCard')));
}
// Moving into a band: a button takes real focus, a card takes the outline.
// Either way it says what it is, which is the whole point.
function enterBand(bands,bi2,at){
  const band=bands[bi2];
  const items=[...band.children];
  if(!items.length) return;
  if(at<0) at=items.length+at;
  at=Math.max(0,Math.min(items.length-1,at));
  const el=items[at];
  // Whatever can hold focus inside this item announces itself: a book row
  // says "title. author", a shelf card says its name, a letter says the
  // letter. Speaking here as well would either double it or, as it did,
  // quietly drop the author.
  const own = el.querySelector('.meta') || (el.tagName==='BUTTON' ? el : null);
  if(own){
    pick = (band.id==='fieldRow' || band.id==='letters') ? -1 : at;
    own.focus();
  }else{
    try{ document.activeElement.blur(); }catch(e){}
    pick=at;
    hi(band,at,true);
    const t=el.querySelector('.nm,.t');
    say(t ? t.textContent : el.textContent);
  }
  el.scrollIntoView({block:'nearest'});
}

function hi(container,i,fast,noScroll){
  container.querySelectorAll('.shelfCard,.bookRow').forEach(x=>x.classList.remove('on'));
  const sel=container.children[i];
  if(!sel) return;
  sel.classList.add('on');
  // Scrolling on hover made the list fight the mouse wheel: each row passing
  // under the pointer re-centred the page. The pointer needs no help finding
  // a row it is already on — only the keyboard does.
  if(!noScroll) sel.scrollIntoView({block:'center',behavior:fast?'auto':'smooth'});
}

// Speaking on hover has the same problem in the ear: rows sweeping past the
// pointer start and cut off a dozen titles. Wait for the pointer to settle.
let hoverT=null;
function onHover(fn){

// opts.play: start the voice whatever the mode (the next part of a series).
// opts.resume: go straight back to where the child stopped, without asking —
// the Continue button has already asked.
async function openBook(e, opts={}){
  hush();                       // stop the title being read over the last one
  earcon('open');
  // Clear the previous book first. Without this a book that fails to open
  // leaves the last one's chapters in place under the new one's title, and a
  // child hears the wrong story.
  stop();
  // And empty the clip cache. Its keys are chapter:block only, with nothing
  // identifying the book, so the new book's first paragraph asked for "0:0"
  // and was handed the PREVIOUS book's recording — the child heard the old
  // story under the new title.
  dropClips();
  book.entry=e; book.chapters=[]; book.audioBase=null;
  book.title=''; book.author='';
  ci=0; bi=0; si=0; resumeT=0;
  $('shelfNote').classList.remove('hidden');
  $('shelfNote').textContent='Ном нээж байна…';
  try{
    try{ await loadVoiced(e); }
    catch(x){
      const r=await fetch(e.file);
      if(!r.ok) throw new Error('unavailable');
      await loadEpub(await r.arrayBuffer(), e.title);
    }
    put('last',JSON.stringify(e));
    $('nowCoverImg').src=$('resumeCover').src=e.cover||'logo.png';
    $('shelfNote').classList.add('hidden');
    $('playerStatus').classList.add('hidden');
    $('bookTitle').textContent=book.title;
    buildToc();
    // A book already begun asks rather than assuming. Dropping a child into
    // the middle of a story with no explanation is disorienting when you
    // cannot see the page.
    if(loadPos()){
      if(opts.resume){ openAt(false); return; }
      paint();
      $('resumeTitle').textContent = book.title;
      $('resumeWhere').textContent = chap().title;
      show('resume');
      $('resumeGo').focus();
      announce('Үргэлжлүүлэх үү, эхнээс нь үү?');
      return;
    }
    ci=0; bi=0; si=0; paint();
    show(mode==='read'?'reader':'player');
    media();
    announce(book.title);
    if(mode==='listen' || (opts.play && mode!=='read')) play();
  }catch(err){
    $('shelfNote').textContent='Энэ ном хараахан бэлэн болоогүй байна. Өөр ном сонгоно уу.';
    earcon('fail'); say('Энэ ном хараахан бэлэн болоогүй байна.');
    console.error(err);
  }
}

function buildToc(){
  $('tocList').innerHTML='';

    const b=document.createElement('button');
    b.className='bookRow'; b.style.display='block'; b.style.padding='18px';
    b.innerHTML='<span class="t">'+(i+1)+'. '+esc(c.title)+'</span>';
    b.addEventListener('click',()=>{ earcon('open'); jump(i); });
