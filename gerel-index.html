<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Гэрэл — Хүүхдийн сонсох номын сан</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0A1730; --night-2:#122444;
    --lamp:#FFC24B; --lamp-dim:#B8862B;
    --dawn:#7FA3CC; --paper:#F4F1E8;
    --display:'Unbounded', system-ui, sans-serif;
    --body:'Inter', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--night);color:var(--paper);
    font-family:var(--body);min-height:100%;-webkit-text-size-adjust:100%;}
  body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;}

  header{padding:18px 20px 14px;border-bottom:1px solid rgba(127,163,204,0.22);
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .wordmark{font-family:var(--display);font-weight:800;font-size:20px;
    letter-spacing:0.02em;color:var(--lamp);}
  .wordmark span{color:var(--paper);font-weight:600;}
  .bookmeta{font-size:14px;color:var(--dawn);text-align:right;flex:1;min-width:140px;}
  .bookmeta strong{color:var(--paper);font-weight:600;display:block;}

  main{flex:1;padding:24px 20px 12px;display:flex;flex-direction:column;
    justify-content:center;gap:20px;}
  #chapterLabel{font-size:15px;font-weight:600;letter-spacing:0.08em;
    text-transform:uppercase;color:var(--lamp-dim);}
  #reading{font-size:clamp(24px,5.2vw,40px);line-height:1.45;font-weight:600;
    letter-spacing:-0.01em;max-width:22ch;}
  #reading .spoken{color:var(--lamp);}
  #reading .pending{color:rgba(244,241,232,0.55);}
  #upNext{font-size:clamp(15px,2.6vw,19px);line-height:1.6;
    color:rgba(127,163,204,0.75);max-width:40ch;}

  footer{padding:12px 16px calc(20px + env(safe-area-inset-bottom));
    border-top:1px solid rgba(127,163,204,0.22);display:flex;flex-direction:column;gap:12px;}
  .transport{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:12px;}
  button{font-family:var(--body);font-size:17px;font-weight:600;color:var(--night);
    background:var(--paper);border:none;border-radius:18px;padding:22px 12px;
    min-height:76px;cursor:pointer;line-height:1.2;}
  button.play{background:var(--lamp);font-size:19px;font-weight:800;}
  button.quiet{background:transparent;color:var(--dawn);
    border:2px solid rgba(127,163,204,0.4);min-height:56px;padding:14px 12px;
    font-size:15px;border-radius:14px;}
  button:disabled{opacity:0.35;cursor:default;}
  button:focus-visible{outline:4px solid var(--lamp);outline-offset:3px;}
  .secondary{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  #status{font-size:14px;color:var(--dawn);min-height:20px;text-align:center;}

  #shelf{position:fixed;inset:0;z-index:45;background:var(--night);
    display:flex;flex-direction:column;gap:12px;overflow-y:auto;
    padding:22px 18px calc(20px + env(safe-area-inset-bottom));}
  #shelf h1{font-family:var(--display);font-weight:800;
    font-size:clamp(30px,8vw,44px);margin:0;color:var(--lamp);}
  #shelf .sub{margin:0 0 6px;color:var(--dawn);font-size:16px;}
  .quickRow{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .shelfGroup h2{font-family:var(--display);font-size:16px;color:var(--lamp);
    margin:26px 0 10px;letter-spacing:0.03em;display:flex;align-items:baseline;gap:10px;}
  .shelfGroup h2 .count{color:rgba(127,163,204,0.5);font-weight:600;font-size:13px;
    font-family:var(--body);}
  .bookRow{display:flex;gap:14px;align-items:center;width:100%;text-align:left;
    background:rgba(255,255,255,0.03);color:var(--paper);
    border:2px solid rgba(127,163,204,0.28);border-radius:18px;
    padding:12px;margin-bottom:10px;min-height:0;}
  .bookRow .cover{
    flex:0 0 62px;width:62px;height:88px;border-radius:10px;overflow:hidden;
    background:var(--night-2);display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-weight:800;font-size:26px;color:var(--lamp-dim);
  }
  .bookRow .cover img{width:100%;height:100%;object-fit:cover;display:block;}
  .bookRow .meta{flex:1;min-width:0;}
  .bookRow .t{display:block;font-size:18px;font-weight:600;line-height:1.3;}
  .bookRow .who{display:block;font-size:14px;font-weight:400;
    color:var(--dawn);margin-top:4px;}
  .bookRow .len{display:block;font-size:13px;font-weight:400;
    color:rgba(127,163,204,0.6);margin-top:3px;}
  .bookRow .mark{
    display:inline-block;margin-left:8px;font-size:12px;font-weight:600;
    color:var(--lamp);border:1px solid var(--lamp-dim);border-radius:99px;
    padding:1px 8px;vertical-align:middle;
  }
  .bookRow.on{border-color:var(--lamp);border-width:3px;padding:11px;
    background:rgba(255,194,75,0.08);}
  .bookRow.on .t{color:var(--lamp);}
  .bookRow.on .who{color:var(--lamp-dim);}
  #shelfNote{border:2px dashed rgba(127,163,204,0.35);border-radius:16px;
    padding:18px;color:var(--dawn);font-size:15px;line-height:1.6;}
  #openFileLabel{display:block;text-align:center;cursor:pointer;
    border:2px solid rgba(127,163,204,0.4);border-radius:14px;padding:16px;
    color:var(--dawn);font-size:15px;margin-top:10px;}
  #fileInput{position:absolute;opacity:0;width:1px;height:1px;}
  .credit{font-size:13px;color:rgba(127,163,204,0.6);margin-top:14px;line-height:1.6;}

  /* Reading view: the whole chapter as text, following the voice. Serves a
     low-vision child reading along, a sighted sibling, and a teacher. */
  #readPanel{position:fixed;inset:0;z-index:42;background:var(--night);
    display:flex;flex-direction:column;}
  #readBar{display:flex;gap:8px;align-items:center;padding:12px 16px;
    border-bottom:1px solid rgba(127,163,204,0.22);}
  #readBar .who{flex:1;min-width:0;font-size:14px;color:var(--dawn);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #readBar button{min-height:44px;padding:10px 14px;font-size:15px;border-radius:12px;
    background:transparent;color:var(--dawn);border:2px solid rgba(127,163,204,0.4);}
  #readBody{flex:1;overflow-y:auto;padding:20px 20px 60px;
    font-size:var(--readSize,21px);line-height:1.75;}
  #readBody p{margin:0 0 1.1em;}
  #readBody .sent{cursor:pointer;border-radius:6px;padding:1px 2px;}
  #readBody .sent.now{background:var(--lamp);color:var(--night);font-weight:600;}
  #tocPanel{position:fixed;inset:0;z-index:40;background:var(--night-2);
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    overflow-y:auto;display:flex;flex-direction:column;gap:10px;}
  #tocPanel h2{font-family:var(--display);font-size:19px;margin:0 0 6px;color:var(--lamp);}
  .tocItem{text-align:left;background:transparent;color:var(--paper);
    border:2px solid rgba(127,163,204,0.3);border-radius:14px;
    padding:18px 16px;font-size:17px;min-height:0;}
  .tocItem.current{border-color:var(--lamp);color:var(--lamp);}
  .hidden{display:none !important;}
</style>
</head>
<body>

<header>
  <div class="wordmark">Гэрэл <span>· хүүхдийн номын сан</span></div>
  <div class="bookmeta"><strong id="bookTitle">—</strong><span id="bookAuthor"></span></div>
</header>

<main>
  <div id="chapterLabel">Ном сонгоно уу</div>
  <div id="reading"></div>
  <div id="upNext"></div>
</main>

<footer>
  <div id="status" role="status" aria-live="polite"></div>
  <div class="transport">
    <button id="prevBtn" disabled>◀ Өмнөх<br>өгүүлбэр</button>
    <button id="playBtn" class="play" disabled>▶ Унших</button>
    <button id="nextBtn" disabled>Дараах<br>өгүүлбэр ▶</button>
  </div>
  <div class="secondary">
    <button id="speedBtn" class="quiet">Хурд 1×</button>
    <button id="readerBtn" class="quiet">Хоолой: Есүй</button>
    <button id="tocBtn" class="quiet" disabled>Бүлгүүд</button>
    <button id="shelfBtn" class="quiet">Номын сан</button>
  </div>
  <div class="secondary">
    <button id="readBtn" class="quiet" disabled>Уншиж харах</button>
    <button id="voiceBtn" class="quiet" disabled>Дуут удирдлага</button>
  </div>
</footer>

<div id="readPanel" class="hidden" aria-label="Уншиж харах">
  <div id="readBar">
    <span class="who" id="readTitle"></span>
    <button id="readSmaller" aria-label="Жижигрүүлэх">А−</button>
    <button id="readBigger" aria-label="Томруулах">А+</button>
    <button id="readClose">Хаах</button>
  </div>
  <div id="readBody"></div>
</div>

<div id="tocPanel" class="hidden" aria-label="Бүлгүүд">
  <h2>Бүлгүүд</h2>
  <div id="tocList"></div>
  <button id="tocCloseBtn" class="quiet">Хаах</button>
</div>

<div id="shelf">
  <h1>Гэрэл</h1>
  <p class="sub">Ном сонгоод сонсоорой.</p>

  <div class="quickRow">
    <button id="resumeBtn" class="play hidden">Үргэлжлүүлэх</button>
    <button id="surpriseBtn" class="quiet">Ямар нэг үлгэр</button>
  </div>

  <div id="shelfList"></div>
  <div id="shelfNote" class="hidden"></div>

  <label id="openFileLabel" tabindex="0">
    Өөрийн ном нээх
    <input type="file" id="fileInput" accept=".epub,application/epub+zip">
  </label>

  <p class="credit" id="shelfCredit"></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@1.40.0/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js"></script>
<script>
// ============================================================
// Settings
// ============================================================
// Books that have been voiced already live here as plain MP3 files. When a
// book has been voiced, the app plays those and never touches Azure — which
// is why no key needs to sit in this page once the library is voiced.
const AUDIO_ROOT = 'audio';

// Only used for books that have not been voiced yet. Leave empty once the
// whole library has audio, and the key disappears from the page entirely.
const AZURE_SPEECH_KEY = "";
const AZURE_SPEECH_REGION = "eastasia";

const READERS = [
  { id: 'mn-MN-YesuiNeural', label: 'Есүй' },
  { id: 'mn-MN-BataaNeural', label: 'Батаа' }
];
let readerIndex = 0;
try{
  const v = parseInt(localStorage.getItem('gerel:reader'), 10);
  if(!isNaN(v) && READERS[v]) readerIndex = v;
}catch(e){}
function currentVoice(){ return READERS[readerIndex].id; }

const SPEEDS = [0.6, 0.7, 0.85, 1.0, 1.15, 1.3];
let speedIndex = 2;
try{
  const v = parseInt(localStorage.getItem('gerel:speed'), 10);
  if(!isNaN(v) && SPEEDS[v]) speedIndex = v;
}catch(e){}
function ratePercent(){
  const pct = Math.round((SPEEDS[speedIndex] - 1) * 100);
  return (pct >= 0 ? '+' : '') + pct + '%';
}

const audioEl = new Audio();
audioEl.preload = 'auto';
let audioUnlocked = false;
function unlockAudio(){
  if(audioUnlocked) return;
  audioUnlocked = true;
  audioEl.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=';
  audioEl.play().catch(()=>{});
}

// ============================================================
// Speaking — only for books not yet voiced
// ============================================================
function escapeXml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
}
function haveLiveVoice(){ return !!AZURE_SPEECH_KEY && !!window.SpeechSDK; }

function newSynth(){
  const cfg = SpeechSDK.SpeechConfig.fromSubscription(AZURE_SPEECH_KEY, AZURE_SPEECH_REGION);
  cfg.speechSynthesisVoiceName = currentVoice();
  cfg.speechSynthesisOutputFormat = SpeechSDK.SpeechSynthesisOutputFormat.Audio24Khz48KBitRateMonoMp3;
  return new SpeechSDK.SpeechSynthesizer(cfg, null);
}

function synthParagraph(sentences){
  return new Promise((resolve, reject) => {
    if(!haveLiveVoice()){ reject(new Error('no voice available')); return; }
    const synth = newSynth();
    const head = '<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="mn-MN">'
      + '<voice name="' + currentVoice() + '"><prosody rate="' + ratePercent() + '">';
    let ssml = head;
    const spans = [];
    sentences.forEach((text, i) => {
      if(i > 0) ssml += '<break time="260ms"/>';
      const safe = escapeXml(text);
      spans.push({ start: ssml.length, len: safe.length, exact: safe.length === text.length });
      ssml += safe;
    });
    ssml += '</prosody></voice></speak>';

    const boundaries = [];
    synth.wordBoundary = (sender, e) => {
      const at = e.textOffset;
      for(let i = 0; i < spans.length; i++){
        const sp = spans[i];
        if(at >= sp.start && at < sp.start + sp.len){
          boundaries.push({ sentence:i, char: sp.exact ? at - sp.start : 0,
                            len: sp.exact ? e.wordLength : 0, time: e.audioOffset/10000000 });
          return;
        }
      }
    };
    synth.speakSsmlAsync(ssml,
      r => {
        if(r.reason === SpeechSDK.ResultReason.SynthesizingAudioCompleted && r.audioData){
          const url = URL.createObjectURL(new Blob([r.audioData], {type:'audio/mpeg'}));
          try{ synth.close(); }catch(e){}
          resolve({ url, boundaries });
        } else {
          try{ synth.close(); }catch(e){}
          reject(new Error(r.errorDetails || 'synthesis failed'));
        }
      },
      err => { try{ synth.close(); }catch(e){} reject(new Error(err)); });
  });
}

// Short spoken phrase, for reading a title aloud on the shelf.
function say(text){
  if(!haveLiveVoice()) return;
  const synth = newSynth();
  const ssml = '<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="mn-MN">'
    + '<voice name="' + currentVoice() + '">' + escapeXml(text) + '</voice></speak>';
  synth.speakSsmlAsync(ssml,
    r => {
      try{ synth.close(); }catch(e){}
      if(r.audioData){
        audioEl.src = URL.createObjectURL(new Blob([r.audioData], {type:'audio/mpeg'}));
        audioEl.play().catch(()=>{});
      }
    },
    () => { try{ synth.close(); }catch(e){} });
}

// ============================================================
// Clips — from voiced files when they exist, otherwise spoken live
// ============================================================
const clipCache = new Map();
function clipKey(c, b){ return c + ':' + b; }

function getClip(c, b){
  const key = clipKey(c, b);
  if(clipCache.has(key)) return clipCache.get(key);

  const block = book.chapters[c].blocks[b];
  let p;
  if(book.audioBase && block.audio){
    p = Promise.resolve({
      url: book.audioBase + '/' + block.audio,
      boundaries: (block.marks || []).map(m => ({
        sentence: m.s, char: m.c, len: m.l, time: m.t
      }))
    });
  } else {
    p = synthParagraph(block.sentences);
  }
  clipCache.set(key, p);
  return p;
}

function clearClips(keep = []){
  const keepSet = new Set(keep);
  clipCache.forEach((val, key) => {
    if(keepSet.has(key)) return;
    // Only blobs we made need releasing; voiced files are ordinary URLs.
    Promise.resolve(val).then(clip => {
      if(clip && clip.url && clip.url.startsWith('blob:')) URL.revokeObjectURL(clip.url);
    }).catch(()=>{});
    clipCache.delete(key);
  });
}

function playClip(clip, startTime){
  return new Promise((resolve, reject) => {
    let frame = null;
    function cleanup(){
      audioEl.removeEventListener('ended', onEnd);
      audioEl.removeEventListener('error', onErr);
      if(frame) cancelAnimationFrame(frame);
    }
    function onEnd(){ cleanup(); resolve(); }
    function onErr(){ cleanup(); reject(new Error('audio playback error')); }
    function tick(){
      if(!playing){ cleanup(); return; }
      const t = audioEl.currentTime;
      let cur = null;
      for(const b of clip.boundaries){ if(b.time <= t) cur = b; else break; }
      if(cur){ sentenceIndex = cur.sentence; render(cur.char + cur.len); }
      frame = requestAnimationFrame(tick);
    }
    audioEl.addEventListener('ended', onEnd);
    audioEl.addEventListener('error', onErr);
    audioEl.src = clip.url;
    audioEl.playbackRate = book.audioBase ? SPEEDS[speedIndex] : 1;
    if(startTime > 0){
      audioEl.addEventListener('loadedmetadata', () => {
        try{ audioEl.currentTime = startTime; }catch(e){}
      }, { once: true });
    }
    audioEl.play().then(() => { frame = requestAnimationFrame(tick); })
                  .catch(err => { cleanup(); reject(err); });
  });
}

// ============================================================
// Books
// ============================================================
const book = { title:'', author:'', credit:'', chapters:[], audioBase:null };

const PROMO_MARKERS = ['bolorsoft','болор дуран','сурталчилгаа','программтай танилцах',
                       'хандив','хаан банк','qpay','e-nom.mn','үнэ төлбөр'];
const CREDIT_MARKERS = ['e-nom.mn','цахим номын сан','хөрвүүлэв','эрхлэн хэвлүүлсэн','хэвлэлийн газар'];
const FRONT_MARKERS = ['хэвлэлийн мэдээлэл','хэвлэн нийтлэл','isbn','удк','ббк','редактор',
                       'эрхлэн гаргав','хянан тохиолдуулсан','зохиогчийн эрх','ном зүйн','хэвлэлийн эх'];
const SEPARATOR = /^[⁂*※•\s]+$/;

function markerHits(text, words){
  const low = text.toLowerCase();
  return words.reduce((n,w) => n + (low.includes(w) ? 1 : 0), 0);
}
function stripTrailingPromo(paras){
  for(let i = 0; i < paras.length; i++){
    if(!SEPARATOR.test(paras[i])) continue;
    if(markerHits(paras.slice(i).join(' '), PROMO_MARKERS) >= 2) return paras.slice(0, i);
  }
  return paras;
}
function tidyParagraph(t){
  return t.replace(/^\s*\[\s*[←<]\s*\d+\s*\]\s*/, '').trim();
}
function splitSentences(text){
  const raw = text.match(/[^.!?…]+[.!?…]+[»”"']?|[^.!?…]+$/g) || [text];
  const out = []; let carry = '';
  raw.forEach(part => {
    const s = (carry + part).trim();
    if(!s) return;
    if(s.length < 16){ carry = s + ' '; return; }
    out.push(s); carry = '';
  });
  if(carry.trim()) out.push(carry.trim());
  return out.length ? out : [text];
}

function stripTags(html){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('script, style').forEach(n => n.remove());
  return doc;
}
function paragraphsFrom(doc){
  const els = [...doc.querySelectorAll('p, h1, h2, h3, h4, li, blockquote')];
  const src = els.length ? els : [doc.body];
  const out = [];
  src.forEach(el => {
    const t = (el.textContent || '').replace(/\s+/g,' ').trim();
    if(t.length >= 1) out.push(t);
  });
  return out;
}

// A book that has already been voiced: read its index instead of the EPUB.
async function loadVoiced(entry){
  const base = AUDIO_ROOT + '/' + entry.id;
  const res = await fetch(base + '/index.json', { cache: 'force-cache' });
  if(!res.ok) throw new Error('not voiced');
  const data = await res.json();
  book.title = data.title || entry.title;
  book.author = data.author || entry.author || '';
  book.credit = '';
  book.audioBase = base;
  book.chapters = data.chapters.map(ch => ({
    title: ch.title,
    blocks: ch.blocks.map(b => ({ sentences: b.sentences, audio: b.audio, marks: b.marks }))
  }));
  if(!book.chapters.length) throw new Error('empty');
}

async function loadEpub(data, fallbackName){
  const zip = await JSZip.loadAsync(data);
  const container = await zip.file('META-INF/container.xml').async('string');
  const opfPath = new DOMParser().parseFromString(container,'application/xml')
    .querySelector('rootfile').getAttribute('full-path');
  const opfDir = opfPath.includes('/') ? opfPath.replace(/\/[^/]*$/,'/') : '';
  const opf = new DOMParser().parseFromString(await zip.file(opfPath).async('string'),'application/xml');

  book.audioBase = null;
  book.title = (opf.querySelector('metadata > *|title') || opf.querySelector('title'))
    ?.textContent?.trim() || fallbackName || 'Ном';
  book.author = (opf.querySelector('metadata > *|creator') || opf.querySelector('creator'))
    ?.textContent?.trim() || '';

  const hrefById = {};
  opf.querySelectorAll('manifest > item').forEach(i => hrefById[i.getAttribute('id')] = i.getAttribute('href'));
  const spine = [...opf.querySelectorAll('spine > itemref')]
    .map(r => hrefById[r.getAttribute('idref')]).filter(Boolean);

  const titleByFile = {};
  const ncx = Object.values(hrefById).find(h => h && h.endsWith('.ncx'));
  if(ncx && zip.file(opfDir + ncx)){
    const t = new DOMParser().parseFromString(await zip.file(opfDir+ncx).async('string'),'application/xml');
    t.querySelectorAll('navPoint').forEach(np => {
      const src = np.querySelector('content')?.getAttribute('src') || '';
      const label = np.querySelector('navLabel text')?.textContent?.trim();
      const key = src.split('#')[0].split('/').pop();
      if(key && label && !titleByFile[key]) titleByFile[key] = label;
    });
  }

  book.chapters = []; book.credit = '';
  for(const href of spine){
    const entry = zip.file(opfDir + href) || zip.file(href);
    if(!entry) continue;
    const doc = stripTags(await entry.async('string'));
    let paras = paragraphsFrom(doc).map(tidyParagraph).filter(t => t.length >= 1);
    if(!paras.length) continue;
    const whole = paras.join(' ');
    if(whole.length < 800 && markerHits(whole, PROMO_MARKERS) >= 2) continue;
    if(whole.length < 1500 && markerHits(whole, CREDIT_MARKERS) >= 2){
      if(!book.credit) book.credit = whole;
      continue;
    }
    if(whole.length < 1200 && markerHits(whole, FRONT_MARKERS) >= 2) continue;
    if(!book.chapters.length && whole.length < 400) continue;

    paras = stripTrailingPromo(paras).filter(t => t.length > 1);
    if(!paras.length) continue;
    const blocks = paras.map(p => ({ sentences: splitSentences(p) }));
    const key = href.split('/').pop();
    book.chapters.push({
      title: titleByFile[key] || doc.querySelector('h1,h2,h3')?.textContent?.trim() || paras[0].slice(0,60),
      blocks
    });
  }
  if(!book.chapters.length) throw new Error('Энэ номноос текст олдсонгүй.');
}

// ============================================================
// Player
// ============================================================
const els = {};
['fileInput','bookTitle','bookAuthor','chapterLabel','reading','upNext','status',
 'playBtn','prevBtn','nextBtn','tocBtn','voiceBtn','speedBtn','readerBtn','shelfBtn',
 'tocPanel','tocList','tocCloseBtn','shelf','shelfList','shelfNote','shelfCredit',
 'resumeBtn','surpriseBtn','openFileLabel',
 'readPanel','readBody','readBar','readTitle','readBtn','readClose','readBigger','readSmaller'
].forEach(id => els[id] = document.getElementById(id));

let chapterIndex = 0, blockIndex = 0, sentenceIndex = 0, playing = false;

function positionKey(){ return 'gerel:pos:' + book.title; }
function savePosition(){
  try{ localStorage.setItem(positionKey(), JSON.stringify({chapterIndex, blockIndex, sentenceIndex})); }catch(e){}
}
function restorePosition(){
  try{
    const s = JSON.parse(localStorage.getItem(positionKey()) || 'null');
    const ch = s && book.chapters[s.chapterIndex];
    if(ch){
      chapterIndex = s.chapterIndex;
      blockIndex = Math.min(s.blockIndex || 0, ch.blocks.length - 1);
      sentenceIndex = Math.min(s.sentenceIndex || 0, ch.blocks[blockIndex].sentences.length - 1);
      return true;
    }
  }catch(e){}
  return false;
}

function currentChapter(){ return book.chapters[chapterIndex]; }
function currentBlock(){ return currentChapter().blocks[blockIndex]; }
function currentSentence(){ return currentBlock().sentences[sentenceIndex] || ''; }

function sentenceCounter(){
  const ch = currentChapter();
  let before = 0;
  for(let i = 0; i < blockIndex; i++) before += ch.blocks[i].sentences.length;
  return { at: before + sentenceIndex + 1,
           total: ch.blocks.reduce((n,b) => n + b.sentences.length, 0) };
}
function escapeHtml(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function render(highlight){
  if(!book.chapters.length) return;
  const c = sentenceCounter();
  els.chapterLabel.textContent = currentChapter().title + ' · ' + c.at + '/' + c.total;
  const text = currentSentence();
  if(highlight > 0 && highlight < text.length){
    els.reading.innerHTML = '<span class="spoken">' + escapeHtml(text.slice(0,highlight)) + '</span>'
      + '<span class="pending">' + escapeHtml(text.slice(highlight)) + '</span>';
  } else {
    els.reading.textContent = text;
  }
  const blk = currentBlock();
  const nextBlk = currentChapter().blocks[blockIndex + 1];
  els.upNext.textContent = blk.sentences[sentenceIndex+1] || (nextBlk && nextBlk.sentences[0]) || '';
  markReadSentence(true);
  savePosition();
}
function announce(m){ els.status.textContent = m; }

function nextBlockPosition(c, b){
  if(b + 1 < book.chapters[c].blocks.length) return { c, b: b+1 };
  if(c + 1 < book.chapters.length) return { c: c+1, b: 0 };
  return null;
}

async function playFromHere(){
  unlockAudio();
  playing = true;
  els.playBtn.textContent = '\u275a\u275a Зогсоох';
  announce('');
  while(playing && chapterIndex < book.chapters.length){
    render(0);
    let clip;
    try{ clip = await getClip(chapterIndex, blockIndex); }
    catch(e){
      if(playing){ announce('Энэ ном хараахан бэлэн болоогүй байна.'); stopPlayback(); }
      return;
    }
    if(!playing) return;
    const up = nextBlockPosition(chapterIndex, blockIndex);
    if(up) getClip(up.c, up.b).catch(()=>{});
    const from = clip.boundaries.find(b => b.sentence === sentenceIndex);
    try{ await playClip(clip, from ? from.time : 0); }
    catch(e){
      if(playing){ announce('Дуу тоглуулж чадсангүй. Дахин "Унших" дарна уу.'); stopPlayback(); }
      return;
    }
    if(!playing) return;
    if(!up){ stopPlayback(); announce('Ном дууслаа.'); return; }
    const newChapter = up.c !== chapterIndex;
    chapterIndex = up.c; blockIndex = up.b; sentenceIndex = 0;
    if(newChapter) announce(currentChapter().title);
    const after = nextBlockPosition(chapterIndex, blockIndex);
    clearClips([clipKey(chapterIndex, blockIndex)].concat(after ? [clipKey(after.c, after.b)] : []));
  }
}
function stopPlayback(){
  playing = false;
  try{ audioEl.pause(); }catch(e){}
  els.playBtn.textContent = '\u25b6 Унших';
  render();
}
function goSentence(d){
  const was = playing; stopPlayback();
  let c = chapterIndex, b = blockIndex, s = sentenceIndex + d;
  while(s < 0){
    if(b > 0){ b--; s += book.chapters[c].blocks[b].sentences.length; }
    else if(c > 0){ c--; b = book.chapters[c].blocks.length-1; s += book.chapters[c].blocks[b].sentences.length; }
    else { s = 0; break; }
  }
  while(s >= book.chapters[c].blocks[b].sentences.length){
    const len = book.chapters[c].blocks[b].sentences.length;
    if(b+1 < book.chapters[c].blocks.length){ s -= len; b++; }
    else if(c+1 < book.chapters.length){ s -= len; c++; b = 0; }
    else { s = len-1; break; }
  }
  chapterIndex=c; blockIndex=b; sentenceIndex=s;
  render();
  if(was) playFromHere();
}
function goChapter(d){
  const was = playing; stopPlayback();
  const t = chapterIndex + d;
  if(t < 0 || t >= book.chapters.length) return;
  chapterIndex = t; blockIndex = 0; sentenceIndex = 0;
  render(); announce(currentChapter().title);
  if(was) playFromHere();
}
function jumpToChapter(i){
  stopPlayback();
  chapterIndex = i; blockIndex = 0; sentenceIndex = 0;
  render(); els.tocPanel.classList.add('hidden'); playFromHere();
}
function repeatParagraph(){ stopPlayback(); sentenceIndex = 0; render(); playFromHere(); }

els.playBtn.addEventListener('click', () => playing ? stopPlayback() : playFromHere());
els.prevBtn.addEventListener('click', () => goSentence(-1));
els.nextBtn.addEventListener('click', () => goSentence(1));

function updateSpeedLabel(){
  els.speedBtn.textContent = 'Хурд ' + SPEEDS[speedIndex].toFixed(2).replace(/0$/,'') + '×';
}
els.speedBtn.addEventListener('click', () => {
  speedIndex = (speedIndex + 1) % SPEEDS.length;
  try{ localStorage.setItem('gerel:speed', String(speedIndex)); }catch(e){}
  updateSpeedLabel(); announce('Хурд: ' + SPEEDS[speedIndex] + '×');
  if(book.audioBase){ audioEl.playbackRate = SPEEDS[speedIndex]; }  // voiced audio: instant
  else { clearClips(); if(playing){ stopPlayback(); playFromHere(); } }
});
updateSpeedLabel();

function updateReaderLabel(){ els.readerBtn.textContent = 'Хоолой: ' + READERS[readerIndex].label; }
els.readerBtn.addEventListener('click', () => {
  if(book.audioBase){ announce('Энэ ном аль хэдийн уншигдсан байна.'); return; }
  readerIndex = (readerIndex + 1) % READERS.length;
  try{ localStorage.setItem('gerel:reader', String(readerIndex)); }catch(e){}
  updateReaderLabel(); clearClips();
  announce('Хоолой: ' + READERS[readerIndex].label);
  if(playing){ stopPlayback(); playFromHere(); }
});
updateReaderLabel();

// ---- Reading view ----
// The chapter is laid out as ordinary paragraphs. The sentence being spoken is
// marked, and tapping any sentence starts the voice from there — so reading
// and listening are the same act rather than two modes.
let readSize = 21;
try{
  const v = parseInt(localStorage.getItem('gerel:readSize'), 10);
  if(!isNaN(v) && v >= 15 && v <= 44) readSize = v;
}catch(e){}

function applyReadSize(){
  els.readBody.style.setProperty('--readSize', readSize + 'px');
  try{ localStorage.setItem('gerel:readSize', String(readSize)); }catch(e){}
}

function buildReadView(){
  const chapter = currentChapter();
  els.readTitle.textContent = chapter.title;
  const html = chapter.blocks.map((block, b) =>
    '<p>' + block.sentences.map((text, si) =>
      '<span class="sent" data-b="' + b + '" data-s="' + si + '">'
        + escapeHtml(text) + '</span>'
    ).join(' ') + '</p>'
  ).join('');
  els.readBody.innerHTML = html;
  els.readBody.dataset.chapter = String(chapterIndex);
  applyReadSize();
  markReadSentence(true);
}

function markReadSentence(scroll){
  if(els.readPanel.classList.contains('hidden')) return;
  if(els.readBody.dataset.chapter !== String(chapterIndex)){ buildReadView(); return; }
  const prev = els.readBody.querySelector('.sent.now');
  if(prev) prev.classList.remove('now');
  const el = els.readBody.querySelector(
    '.sent[data-b="' + blockIndex + '"][data-s="' + sentenceIndex + '"]');
  if(el){
    el.classList.add('now');
    if(scroll) el.scrollIntoView({ block:'center', behavior:'smooth' });
  }
}

els.readBtn.addEventListener('click', () => {
  if(!book.chapters.length) return;
  els.readPanel.classList.remove('hidden');
  buildReadView();
});
els.readClose.addEventListener('click', () => els.readPanel.classList.add('hidden'));
els.readBigger.addEventListener('click', () => {
  readSize = Math.min(44, readSize + 3); applyReadSize();
});
els.readSmaller.addEventListener('click', () => {
  readSize = Math.max(15, readSize - 3); applyReadSize();
});
els.readBody.addEventListener('click', e => {
  const sent = e.target.closest('.sent');
  if(!sent) return;
  unlockAudio();
  stopPlayback();
  blockIndex = parseInt(sent.dataset.b, 10);
  sentenceIndex = parseInt(sent.dataset.s, 10);
  render();
  markReadSentence(false);
  playFromHere();
});

els.tocBtn.addEventListener('click', () => els.tocPanel.classList.remove('hidden'));
els.tocCloseBtn.addEventListener('click', () => els.tocPanel.classList.add('hidden'));
els.shelfBtn.addEventListener('click', () => { stopPlayback(); els.shelf.classList.remove('hidden'); });

let touchX = null;
document.addEventListener('touchstart', e => { touchX = e.changedTouches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e => {
  if(touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX; touchX = null;
  if(!els.shelf.classList.contains('hidden')) return;
  if(Math.abs(dx) > 90) goChapter(dx < 0 ? 1 : -1);
}, {passive:true});

// A plain USB or Bluetooth numeric keypad works as a control device with no
// extra hardware: the keys below are laid out so they can be found by touch,
// with the raised nub on 5 as the anchor. Braille caps can be printed later.
//    7 back chapter   8 repeat        9 forward chapter
//    4 back sentence  5 play/stop     6 forward sentence
//    0 play/stop (large)   .  shelf
document.addEventListener('keydown', e => {
  if(!els.shelf.classList.contains('hidden')) return;
  if(!els.readPanel.classList.contains('hidden') && e.code === 'Escape'){
    els.readPanel.classList.add('hidden'); return;
  }
  const playPause = () => playing ? stopPlayback() : playFromHere();

  if(e.code === 'Space' || e.code === 'Numpad0' || e.code === 'Numpad5'){
    e.preventDefault(); playPause(); return;
  }
  if(e.code === 'ArrowRight' || e.code === 'Numpad6') goSentence(1);
  if(e.code === 'ArrowLeft'  || e.code === 'Numpad4') goSentence(-1);
  if(e.code === 'ArrowDown'  || e.code === 'Numpad9') goChapter(1);
  if(e.code === 'ArrowUp'    || e.code === 'Numpad7') goChapter(-1);
  if(e.code === 'Numpad8') repeatParagraph();
  if(e.code === 'NumpadDecimal'){ stopPlayback(); els.shelf.classList.remove('hidden'); }
  if(e.code === 'NumpadAdd'){ els.speedBtn.click(); }
  if(e.code === 'NumpadSubtract'){ els.tocBtn.click(); }
});

// ---- Voice commands ----
let recognition = null, listening = false, voiceReady = false;
function setupVoiceCommands(){
  if(voiceReady) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ els.voiceBtn.disabled = true; els.voiceBtn.textContent = 'Дуут удирдлага байхгүй'; return; }
  voiceReady = true;
  recognition = new SR();
  recognition.continuous = true; recognition.interimResults = false; recognition.lang = 'en-US';
  recognition.onresult = e => {
    const said = e.results[e.results.length-1][0].transcript.toLowerCase().trim();
    if(/\bnext chapter\b/.test(said)) goChapter(1);
    else if(/\b(previous|last) chapter\b/.test(said)) goChapter(-1);
    else if(/\b(next|forward)\b/.test(said)) goSentence(1);
    else if(/\b(previous|back|last)\b/.test(said)) goSentence(-1);
    else if(/\b(stop|pause)\b/.test(said)) stopPlayback();
    else if(/\b(play|read|start|continue)\b/.test(said)){ if(!playing) playFromHere(); }
    else if(/\b(repeat|again)\b/.test(said)) repeatParagraph();
    else return;
    announce('Command: ' + said);
  };
  recognition.onend = () => { if(listening) recognition.start(); };
  recognition.onerror = ev => {
    if(ev.error === 'not-allowed'){
      listening = false; els.voiceBtn.textContent = 'Дуут удирдлага';
      announce('Микрофон зөвшөөрөгдөөгүй.');
    }
  };
  els.voiceBtn.addEventListener('click', () => {
    listening = !listening;
    if(listening){
      try{ recognition.start(); }catch(e){}
      els.voiceBtn.textContent = 'Сонсож байна ●';
      announce('Say: play, stop, next, previous, repeat, next chapter');
    } else {
      recognition.stop(); els.voiceBtn.textContent = 'Дуут удирдлага';
    }
  });
}

function buildToc(){
  els.tocList.innerHTML = '';
  if(book.credit){
    const c = document.createElement('p');
    c.className = 'credit'; c.textContent = book.credit;
    els.tocList.appendChild(c);
  }
  book.chapters.forEach((ch, i) => {
    const b = document.createElement('button');
    b.className = 'tocItem' + (i === chapterIndex ? ' current' : '');
    b.textContent = (i+1) + '. ' + ch.title;
    b.addEventListener('click', () => jumpToChapter(i));
    els.tocList.appendChild(b);
  });
}

function afterBookLoaded(autoPlay){
  els.bookTitle.textContent = book.title;
  els.bookAuthor.textContent = book.author;
  const resumed = restorePosition();
  buildToc(); render();
  [els.playBtn, els.prevBtn, els.nextBtn, els.tocBtn, els.voiceBtn, els.readBtn]
    .forEach(b => b.disabled = false);
  els.readPanel.classList.add('hidden');
  setupVoiceCommands();
  els.shelf.classList.add('hidden');
  announce(resumed ? 'Уншиж байсан газраас үргэлжилнэ.' : book.chapters.length + ' бүлэгтэй.');
  if(autoPlay) playFromHere();
}

// ============================================================
// Shelf
// ============================================================
// A blind child cannot scan a list, so the shelf speaks: tap once to hear a
// title, tap again to open it — the rhythm a screen reader already teaches.
let catalog = null;
let shelfBooks = [];
let shelfPick = -1;

// Minutes read better as hours once a book runs long.
function formatLength(mins){
  if(mins < 60) return mins + ' минут';
  const h = Math.floor(mins / 60), m = mins % 60;
  return m ? h + ' цаг ' + m + ' минут' : h + ' цаг';
}

// Has this book been opened before? The player saves its place under the
// book's title, so the presence of that key is enough.
function hasProgress(title){
  try{ return !!localStorage.getItem('gerel:pos:' + title); }catch(e){ return false; }
}

function slugFor(entry){
  const stem = entry.file.split('/').pop().replace(/\.epub$/i, '');
  return stem.replace(/[^0-9A-Za-z]+/g, '-').replace(/^-|-$/g, '').toLowerCase().slice(0,60);
}

function speakTitleSoon(text){
  clearTimeout(speakTitleSoon._t);
  speakTitleSoon._t = setTimeout(() => say(text), 250);
}
function markPick(i){
  document.querySelectorAll('.bookRow').forEach(el => el.classList.remove('on'));
  const row = document.querySelector('.bookRow[data-i="' + i + '"]');
  if(row){ row.classList.add('on'); row.scrollIntoView({block:'center', behavior:'smooth'}); }
  shelfPick = i;
}

async function openBook(entry, autoPlay){
  els.shelfNote.classList.remove('hidden');
  els.shelfNote.textContent = 'Ном нээж байна…';
  try{
    try{
      await loadVoiced(entry);                    // voiced already: just play it
    }catch(e){
      const res = await fetch(entry.file);        // not yet voiced: read the book itself
      if(!res.ok) throw new Error('HTTP ' + res.status);
      await loadEpub(await res.arrayBuffer(), entry.title);
    }
    try{ localStorage.setItem('gerel:last', JSON.stringify(entry)); }catch(e){}
    els.shelfNote.classList.add('hidden');
    afterBookLoaded(autoPlay);
  }catch(err){
    els.shelfNote.textContent = 'Нээж чадсангүй: ' + err.message;
    console.error(err);
  }
}

function renderShelf(){
  els.shelfList.innerHTML = '';
  shelfBooks = [];
  // Children's shelves only. The catalogue itself is built children-only, so
  // this is a second guard rather than the only one.
  const groups = (catalog.shelves || []).filter(g => g.forChildren !== false);

  groups.forEach(group => {
    const books = (group.books || []).filter(b => b && b.title && b.file);
    if(!books.length) return;
    const wrap = document.createElement('div');
    wrap.className = 'shelfGroup';
    const h = document.createElement('h2');
    h.innerHTML = escapeHtml(group.name) + ' <span class="count">' + books.length + '</span>';
    wrap.appendChild(h);

    books.forEach(entry => {
      const i = shelfBooks.length;
      entry.id = entry.id || slugFor(entry);
      shelfBooks.push(entry);
      const row = document.createElement('button');
      row.className = 'bookRow';
      row.dataset.i = i;

      // A cover if the book has one, otherwise a tile with its first letter —
      // so the shelf never shows a broken image or an empty gap.
      const cover = entry.cover
        ? '<span class="cover"><img src="' + escapeHtml(entry.cover)
            + '" alt="" loading="lazy"></span>'
        : '<span class="cover">' + escapeHtml((entry.title || '?').trim().charAt(0)) + '</span>';

      // Books already begun are marked, so a child can find their way back.
      const started = hasProgress(entry.title)
        ? '<span class="mark">эхэлсэн</span>' : '';

      row.innerHTML = cover
        + '<span class="meta">'
        +   '<span class="t">' + escapeHtml(entry.title) + started + '</span>'
        +   (entry.author ? '<span class="who">' + escapeHtml(entry.author) + '</span>' : '')
        +   (entry.minutes ? '<span class="len">' + formatLength(entry.minutes) + '</span>' : '')
        + '</span>';
      row.addEventListener('click', () => {
        unlockAudio();
        if(shelfPick === i) openBook(entry, true);
        else { markPick(i); speakTitleSoon(entry.title); }
      });
      wrap.appendChild(row);
    });
    els.shelfList.appendChild(wrap);
  });

  if(catalog.credit) els.shelfCredit.textContent = catalog.credit;

  if(!shelfBooks.length){
    els.shelfNote.classList.remove('hidden');
    els.shelfNote.textContent = 'Номын жагсаалт хоосон байна. Доороос өөрийн ном нээж болно.';
    els.surpriseBtn.disabled = true;
  }
}

document.addEventListener('keydown', e => {
  if(els.shelf.classList.contains('hidden') || !shelfBooks.length) return;
  if(e.code === 'Numpad2') e = { code:'ArrowDown', preventDefault(){} };
  if(e.code === 'Numpad8') e = { code:'ArrowUp', preventDefault(){} };
  if(e.code === 'Numpad0' || e.code === 'NumpadEnter'){
    if(shelfPick >= 0){ openBook(shelfBooks[shelfPick], true); return; }
  }
  if(e.code === 'ArrowDown' || e.code === 'ArrowUp'){
    e.preventDefault();
    const step = e.code === 'ArrowDown' ? 1 : -1;
    const i = Math.max(0, Math.min(shelfBooks.length-1, shelfPick < 0 ? 0 : shelfPick + step));
    markPick(i); speakTitleSoon(shelfBooks[i].title);
  }
  if(e.code === 'Enter' && shelfPick >= 0){ e.preventDefault(); openBook(shelfBooks[shelfPick], true); }
});

els.surpriseBtn.addEventListener('click', () => {
  unlockAudio();
  if(!shelfBooks.length) return;
  const i = Math.floor(Math.random() * shelfBooks.length);
  markPick(i); openBook(shelfBooks[i], true);
});

els.resumeBtn.addEventListener('click', () => {
  unlockAudio();
  try{
    const last = JSON.parse(localStorage.getItem('gerel:last') || 'null');
    if(last && last.file) openBook(last, true);
  }catch(e){}
});

els.fileInput.addEventListener('change', async e => {
  const file = e.target.files[0];
  if(!file) return;
  unlockAudio();
  els.shelfNote.classList.remove('hidden');
  els.shelfNote.textContent = 'Ном нээж байна…';
  try{
    await loadEpub(file, file.name);
    els.shelfNote.classList.add('hidden');
    afterBookLoaded(false);
  }catch(err){
    els.shelfNote.textContent = 'Нээж чадсангүй: ' + err.message;
  }
});
els.openFileLabel.addEventListener('keydown', e => {
  if(e.code === 'Enter' || e.code === 'Space'){ e.preventDefault(); els.fileInput.click(); }
});

(async function init(){
  try{
    const last = JSON.parse(localStorage.getItem('gerel:last') || 'null');
    if(last && last.title) els.resumeBtn.classList.remove('hidden');
  }catch(e){}
  try{
    const res = await fetch('catalog.json', { cache:'no-store' });
    catalog = res.ok ? await res.json() : { shelves: [] };
  }catch(e){
    catalog = { shelves: [] };
  }
  renderShelf();
})();
</script>
</body>
</html>
